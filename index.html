<!DOCTYPE html>
<html lang="zh-CN" data-mode="chat">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // 在渲染前恢复模式，避免闪烁
        (function(){try{const m=localStorage.getItem('chatGenMode');if(m==='gen'||m==='fav')document.documentElement.setAttribute('data-mode',m);}catch(e){}})();
    </script>
    <style>
        /* 内联关键 CSS：在外部样式加载前先生效，防止模式闪烁 */
        [data-mode="fav"] .chat-container,[data-mode="fav"] .input-area,
        [data-mode="fav"] .preset-tags-area,[data-mode="fav"] .gen-controls-panel,
        [data-mode="fav"] .image-preview-area,[data-mode="fav"] .message-anchors{display:none!important}
        [data-mode="gen"] .preset-tags-area{display:none!important}
    </style>
    <meta name="description" content="一个支持多模型切换、图片识别、流式输出、Markdown 渲染的 AI 对话客户端，兼容 OpenAI 格式 API，支持多运营商管理与参数预设, 文生图, z-image-turbo。">
    <meta name="keywords" content="AI Chat, 多模型切换, 图片识别, Markdown, 流式输出, OpenAI API, 参数预设, 大模型对话, LLM, 文生图, z-image-turbo">
    <link rel="icon" type="image/png" href="image/1.png">
    <title>AI Chat — 多模型对话 & 生图网页</title>
    <script src="https://cdn.jsdmirror.com/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdmirror.com/npm/katex/dist/katex.min.css">
    <script src="https://cdn.jsdmirror.com/npm/katex/dist/katex.min.js"></script>
    <script src="https://cdn.jsdmirror.com/npm/katex/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdmirror.com/npm/@highlightjs/cdn-assets@11/highlight.min.js"></script>
    <link rel="stylesheet" id="hljsLightTheme" href="https://cdn.jsdmirror.com/npm/highlight.js@11/styles/github.min.css">
    <link rel="stylesheet" id="hljsDarkTheme" href="https://cdn.jsdmirror.com/npm/highlight.js@11/styles/github-dark.min.css" disabled>
    <script src="https://cdn.jsdmirror.com/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <script type="module">
        // streaming-markdown 用于流式增量渲染，暴露到 window 供非模块脚本调用
        import * as smd from "https://cdn.jsdmirror.com/npm/streaming-markdown/smd.min.js";
        window.smd = smd;
    </script>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/chat.css">
    <link rel="stylesheet" href="styles/input.css">
    <link rel="stylesheet" href="styles/favorites.css">
    <link rel="stylesheet" href="styles/generation.css">
    <link rel="stylesheet" href="styles/presets-markdown.css">
    <link rel="stylesheet" href="styles/modals-settings.css">
    <link rel="stylesheet" href="styles/webdav-settings.css">
    <link rel="stylesheet" href="styles/provider-protocol-settings.css">
    <link rel="stylesheet" href="styles/chat-metrics.css">
    <link rel="stylesheet" href="styles/responsive.css">
    <link rel="stylesheet" href="styles/executor.css">
    <link rel="stylesheet" href="styles/mermaid-viewer.css">
    <link rel="stylesheet" href="styles/scroll-button.css">

</head>
<body>

    <div id="toast" class="toast">操作成功</div>

    <!-- 移动端侧边栏遮罩 -->
    <div class="sidebar-mobile-overlay" id="sidebarMobileOverlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="opacity:.75;flex-shrink:0">
                <path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.5 2.87 8.32 6.84 9.67.5.1.68-.22.68-.48 0-.24-.01-.86-.01-1.69-2.78.62-3.37-1.37-3.37-1.37-.45-1.17-1.11-1.48-1.11-1.48-.91-.64.07-.63.07-.63 1.01.07 1.54 1.06 1.54 1.06.9 1.58 2.36 1.12 2.94.86.09-.67.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.3.1-2.71 0 0 .84-.27 2.75 1.05A9.3 9.3 0 0 1 12 6.79c.85 0 1.7.12 2.5.36 1.9-1.32 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.64 1.03 2.76 0 3.94-2.34 4.81-4.58 5.06.36.32.68.95.68 1.92 0 1.38-.01 2.49-.01 2.83 0 .26.18.58.69.48A10.05 10.05 0 0 0 22 12.26C22 6.58 17.52 2 12 2Z"></path>
            </svg>
            <strong><a href="https://github.com/IIIStudio/AIChat" target="_blank" style="color:inherit;text-decoration:none;">AI Chat</a></strong> <span>@MatrixBuilder</span>
        </div>
        
        <div class="sidebar-header">
            <h2>会话</h2>
            <div class="sidebar-actions">
                <svg onclick="openSearchModal()" width="20" height="20" viewBox="0 0 24 24" title="搜索会话" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <svg onclick="toggleMultiSelect()" width="20" height="20" viewBox="0 0 24 24" title="多选" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                <svg onclick="createNewChat()" width="20" height="20" viewBox="0 0 24 24" title="新建会话" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <svg onclick="toggleSidebar()" width="20" height="20" viewBox="0 0 24 24" title="隐藏侧边栏" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
            </div>
        </div>

        <div class="multi-select-bar" id="multiSelectBar">
            <div class="ms-row-top">
                <span class="ms-count" id="msCount">已选 0 项</span>
                <div class="ms-actions-right">
                    <button class="ms-btn" onclick="selectAll()">全选</button>
                    <button class="ms-btn" onclick="toggleMultiSelect()">取消</button>
                </div>
            </div>
            <div class="ms-row-bottom">
                <button class="ms-btn" onclick="batchPin()">置顶</button>
                <button class="ms-btn" onclick="batchUnpin()">取消置顶</button>
                <button class="ms-btn danger" onclick="batchDelete()">删除</button>
            </div>
        </div>

        <div class="chat-list thin-scrollbar" id="chatList"></div>
    </div>

    <div class="main-content">
        <div class="top-nav">
            <div class="nav-left-actions">
                <svg class="sidebar-toggle-btn" id="showSidebarBtn" onclick="toggleSidebar()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                <div class="mode-toggle-wrap" id="modeToggleWrap">
                    <button class="mode-toggle-btn active" id="modeBtnChat" onclick="setMode('chat')">对话</button>
                    <button class="mode-toggle-btn" id="modeBtnGen" onclick="setMode('gen')">生图</button>
                    <button class="mode-toggle-btn" id="modeBtnFav" onclick="setMode('fav')">收藏</button>
                </div>
            </div>
            <div class="nav-right-actions">
                <button class="dark-mode-btn" onclick="toggleDarkMode()" title="切换深色模式">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button class="settings-btn" onclick="openSettings()">配置 API</button>
            </div>
        </div>

        <div class="message-anchors hidden" id="messageAnchors"></div>
        <div class="anchor-tooltip" id="anchorTooltip"></div>

        <div class="chat-container thin-scrollbar" id="chatContainer">
            <div class="chat-inner" id="chatInner">
                <div class="welcome-screen" id="welcomeScreen">
                    <h1>AI Chat</h1>
                    <p>输入一条消息开始新的会话。</p>
                </div>
                </div>
        </div>

        <div id="favPage" class="thin-scrollbar">
            <div class="fav-tag-bar" id="favTagBar"></div>
            <div class="fav-waterfall" id="favWaterfall"></div>
        </div>

        <div class="preset-tags-area">
            <div class="preset-tags-row" id="presetTagsRow"></div>
        </div>

        <div class="gen-controls-panel" id="genControlsPanel">
            <div class="gen-controls-inner">
                <div class="gen-collapse-bar" onclick="toggleGenControls()">
                    <span style="display:inline-flex;align-items:center;gap:4px;">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 1.65 1.65 0 0 0-.4 1.08V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 8.6 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1 1.65 1.65 0 0 0-1.08-.4H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 8.6a1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 1 1 7.04 3.9l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.6 1.65 1.65 0 0 0 .4-1.08V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15.4 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.4.23.7.56.86 1H21a2 2 0 1 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15Z"></path></svg>
                        生图参数
                    </span>
                    <span class="gen-collapse-summary" id="genCollapseSummary" style="display:none;flex:1;text-align:right;margin-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;"></span>
                    <span class="gen-collapse-arrow" id="genCollapseArrow">▲</span>
                </div>
                <div class="gen-collapse-body" id="genCollapseBody">
                <div class="gen-row">
                    <label>反向词</label>
                    <input type="text" id="genNegativePrompt" placeholder="blurry ugly bad" maxlength="500">
                </div>
                <div class="gen-row">
                    <label>尺寸</label>
                    <input type="hidden" id="genSizePreset" value="1024x1024">
                    <div class="gen-size-btns" role="group" aria-label="尺寸预设">
                        <button type="button" class="gen-size-btn" data-value="1024x1024">1:1</button>
                        <button type="button" class="gen-size-btn" data-value="1024x768">4:3</button>
                        <button type="button" class="gen-size-btn" data-value="768x1024">3:4</button>
                        <button type="button" class="gen-size-btn" data-value="1024x576">16:9</button>
                        <button type="button" class="gen-size-btn" data-value="576x1024">9:16</button>
                        <button type="button" class="gen-size-btn" data-value="custom">自定义</button>
                    </div>
                    <span id="genCustomSize" style="display:none;gap:4px;align-items:center;">
                        <input type="number" id="genWidth" value="1024" min="64" max="2048" style="width:62px;flex:none;">
                        <span style="font-size:12px;color:var(--text-muted);">×</span>
                        <input type="number" id="genHeight" value="1024" min="64" max="2048" style="width:62px;flex:none;">
                    </span>
                </div>
                </div><!-- gen-collapse-body -->
            </div>
        </div>

        <div class="input-area">
            <div class="input-pill">
                <!-- 回到最新位置悬浮按钮 -->
                <div class="scroll-down-btn" id="scrollDownBtn" onclick="scrollToBottomSmoothly()" title="回到最新位置">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
                <div class="image-preview-area" id="imagePreviewArea" style="display:none;">
                    <div class="image-preview-grid" id="imagePreviewGrid"></div>
                </div>
                <textarea id="userInput" placeholder="输入你的问题, Enter 发送, Shift+Enter 换行" rows="1"></textarea>
                <input type="file" id="fileInput" style="display:none;" multiple onchange="handleFileSelected(this)">
                <div class="pill-bottom">
                    <div class="model-switcher">
                        <span class="model-info" id="displayModelName" onclick="event.stopPropagation(); toggleModelDropdown()"></span>
                        <div class="model-dropdown" id="modelDropdown"></div>
                    </div>
                    <div class="thinking-switcher">
                        <span class="thinking-info" id="thinkingInfo" onclick="event.stopPropagation(); toggleThinkingDropdown()" title="思考等级">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>
                            <span id="thinkingLabel">自动</span>
                        </span>
                        <div class="thinking-dropdown" id="thinkingDropdown"></div>
                    </div>
                    <div class="search-switcher" style="display:flex;align-items:center;gap:6px;">
                        <span class="search-info" id="searchInfo" onclick="event.stopPropagation(); toggleSearchState()" title="网络搜索">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                            <span id="searchLabel">搜索关</span>
                        </span>
                        <span class="search-panel-toggle" id="searchPanelToggle" onclick="event.stopPropagation(); handleSearchPanelClick()" title="查看网络搜索详情" style="display:none;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                        </span>
                    </div>
                    <div class="action-group">
                        <button class="action-btn upload-action" onclick="document.getElementById('fileInput').click()" title="上传文件">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                        </button>
                        <button class="action-btn send-action" id="sendBtn" onclick="onSendClick()">
                            <svg class="send-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            <svg class="stop-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- 右侧网络搜索过程侧边栏 -->
    <div class="search-sidebar hidden" id="searchSidebar">
        <div class="search-sidebar-header">
            <span style="font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;color:var(--text-main);">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                网络搜索过程
            </span>
            <span class="search-sidebar-close" onclick="toggleSearchSidebar(false)" title="关闭">×</span>
        </div>
        <div class="search-sidebar-content thin-scrollbar" id="searchSidebarContent">
            <div class="search-sidebar-empty">当前会话未触发网络搜索。</div>
        </div>
    </div>

    <!-- HTML 沙箱执行器面板 -->
    <div id="htmlExecutorModal" class="html-executor-modal" style="display:none;">
        <div class="executor-header">
            <div class="executor-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                HTML 沙箱执行器
            </div>
            <div class="executor-toolbar">
                <div class="cdn-injector">
                    <input type="text" id="cdnInput" placeholder="输入 CDN 库 URL (例如 https://...)" title="注入外部 CDN 库">
                    <button class="executor-btn btn-secondary" onclick="injectCdnLibrary()">注入 CDN</button>
                </div>
                <button class="executor-btn btn-primary" onclick="runSandboxHtml()">重新运行</button>
                <button class="executor-btn btn-secondary" id="btnToggleFullPreview" onclick="toggleFullPreview()">全屏预览</button>
                <button class="executor-btn btn-close" onclick="closeHtmlExecutor()">✕</button>
            </div>
        </div>
        <div class="executor-content" id="executorContent">
            <div class="executor-panel executor-left" id="executorLeftPanel">
                <div class="panel-header">HTML 源码</div>
                <div class="source-editor">
                    <pre class="source-highlight" id="executorHighlight" aria-hidden="true"><code class="hljs language-xml"></code></pre>
                    <textarea id="executorSource" spellcheck="false" placeholder="输入 HTML 代码..."></textarea>
                </div>
            </div>
            <div class="executor-panel executor-right" id="executorRightPanel">
                <div class="panel-header">
                    <span>运行结果</span>
                    <span class="sandbox-badge">Sandbox</span>
                </div>
                <div class="iframe-container">
                    <iframe id="executorIframe" sandbox="allow-scripts"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Mermaid 全屏放大查看器 -->
    <div id="mermaidViewerModal" class="mermaid-viewer-modal" style="display:none;" onwheel="handleMermaidViewerWheel(event)">
        <div class="viewer-header">
            <div class="viewer-title">Mermaid 图表放大视图</div>
            <div class="viewer-actions">
                <button class="viewer-btn" onclick="zoomMermaidViewer(1.2)" title="放大">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                </button>
                <button class="viewer-btn" onclick="zoomMermaidViewer(0.8)" title="缩小">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                </button>
                <button class="viewer-btn" onclick="resetMermaidViewer()" title="重置">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
                </button>
                <button class="viewer-btn btn-close" onclick="closeMermaidViewer()" title="关闭">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
        </div>
        <div class="viewer-body" id="viewerBody" onmousedown="startDragMermaidViewer(event)" style="cursor: grab;">
            <div class="viewer-canvas" id="viewerCanvas"></div>
        </div>
        <div class="viewer-tip">提示：支持使用鼠标拖拽平移、滚轮缩放图表</div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal" style="max-width:700px;">
            <div class="modal-header-row">
                <h2 id="settingsModalTitle">模型 API 配置</h2>
                <div class="export-import-btns" id="settingsExportImportBtns">
                    <button onclick="exportProviders()">导出 JSON</button>
                    <button onclick="document.getElementById('importFileInput').click()">导入 JSON</button>
                    <input type="file" id="importFileInput" style="display:none;" accept=".json" onchange="importProviders(this)">
                </div>
            </div>
            <div class="settings-route-tabs" role="tablist" aria-label="配置类型">
                <button class="settings-route-tab active" id="settingsRouteModels" onclick="switchSettingsRoute('models')">模型配置</button>
                <button class="settings-route-tab" id="settingsRouteWebSearch" onclick="switchSettingsRoute('web-search')">网络搜索配置</button>
                <button class="settings-route-tab" id="settingsRouteWebDav" onclick="switchSettingsRoute('webdav')">WebDAV 备份</button>
            </div>
            <div class="settings-panels" id="settingsModelPanels">
                <div class="settings-left">
                    <div class="settings-left-header">运营商列表</div>
                    <div class="settings-left-list thin-scrollbar" id="settingsLeftList"></div>
                    <div class="settings-left-footer">
                        <button onclick="addProviderInModal()">+ 添加运营商</button>
                    </div>
                </div>
                <div class="settings-right thin-scrollbar" id="settingsRightPanel">
                    <div style="color:var(--text-muted);text-align:center;padding-top:60px;">请从左侧选择一个运营商</div>
                </div>
            </div>
            <div class="settings-search-panel thin-scrollbar" id="settingsSearchPanel"></div>
            <div class="settings-webdav-panel thin-scrollbar" id="settingsWebDavPanel"></div>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="closeSettings()">取消</button>
                <button class="modal-btn btn-save" onclick="saveSettings()">保存配置</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="renameModal">
        <div class="modal">
            <h2>重命名会话</h2>
            <div><input type="text" id="renameInput" placeholder="输入新的标题"></div>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="closeRenameModal()">取消</button>
                <button class="modal-btn btn-save" onclick="saveRename()">保存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="searchModal" style="align-items:flex-start;" onclick="closeSearchModal()">
        <div class="modal" style="max-width:560px;margin-top:50px;padding:0;gap:0;overflow:hidden;border-radius:12px;" onclick="event.stopPropagation()">
            <div style="padding:16px 20px;border-bottom:1px solid var(--border-color);">
                <div style="position:relative;">
                    <svg width="17" height="17" viewBox="0 0 24 24" style="position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:0.3;pointer-events:none;color:var(--text-muted);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="搜索会话…" oninput="performSearch()" autocomplete="off"
                        style="width:100%;padding:10px 38px 10px 38px;border:1px solid var(--border-color);border-radius:10px;font-size:13px;outline:none;background:var(--bg-surface);transition:border-color 0.2s;color:var(--text-main);">
                    <svg id="searchClearBtn" onclick="clearSearch()" width="16" height="16" viewBox="0 0 24 24" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;opacity:0.3;display:none;transition:opacity 0.15s;color:var(--text-muted);" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='0.3'"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </div>
            </div>
            <div id="searchResults" class="thin-scrollbar" style="max-height:360px;overflow-y:auto;padding:12px 16px;min-height:60px;">
                <div style="color:var(--text-muted);padding:20px 0;font-size:13px;text-align:center;">输入关键词搜索会话</div>
            </div>
            <div id="searchStats" style="display:none;padding:10px 16px;border-top:1px solid var(--border-color);font-size:11px;color:var(--text-muted);"></div>
        </div>
    </div>

    <div class="modal-overlay" id="presetEditModal">
        <div class="modal" style="max-width:540px;">
            <h2 id="presetEditTitle" style="margin-bottom:12px;">编辑参数预设</h2>
            <div class="preset-edit-row"><label>名称</label><input type="text" id="presetEditName" placeholder="预设名称"></div>
            <div class="preset-edit-row"><label>提示词</label><textarea id="presetEditSysPrompt" placeholder="System Prompt，为空则不注入"></textarea></div>

            <div class="preset-slider-group">
                <span class="slider-label">思维发散程度</span>
                <span class="slider-val" id="tempVal">0.7</span>
                <input type="range" class="preset-slider" id="presetEditTemp" min="0" max="2" step="0.1" value="0.7" oninput="document.getElementById('tempVal').textContent=this.value">
            </div>

            <div class="preset-slider-group">
                <span class="slider-label">词汇范围</span>
                <span class="slider-val" id="topPVal">1</span>
                <input type="range" class="preset-slider" id="presetEditTopP" min="0" max="1" step="0.05" value="1" oninput="document.getElementById('topPVal').textContent=this.value">
            </div>

            <div class="preset-slider-group">
                <span class="slider-label">重复惩罚</span>
                <span class="slider-val" id="fpVal">0</span>
                <input type="range" class="preset-slider" id="presetEditFp" min="-2" max="2" step="0.1" value="0" oninput="document.getElementById('fpVal').textContent=this.value">
            </div>

            <div class="preset-slider-group">
                <span class="slider-label">话题多样性</span>
                <span class="slider-val" id="ppVal">0</span>
                <input type="range" class="preset-slider" id="presetEditPp" min="-2" max="2" step="0.1" value="0" oninput="document.getElementById('ppVal').textContent=this.value">
            </div>

            <div class="preset-stream-row">
                <span class="stream-label">流式输出</span>
                <span class="preset-stream-opt active" id="streamYes" onclick="selectStream(true)">开</span>
                <span class="preset-stream-opt" id="streamNo" onclick="selectStream(false)">关</span>
                <input type="hidden" id="presetEditStream" value="false">
            </div>

            <div class="modal-actions" style="justify-content:space-between;margin-top:4px;">
                <button class="modal-btn" style="background:var(--bg-surface);color:#cc4444;border:1px solid #e8d0d0;" id="presetDeleteBtn" onclick="deletePreset()">删除预设</button>
                <div style="display:flex;gap:10px;">
                    <button class="modal-btn btn-cancel" onclick="closePresetEdit()">取消</button>
                    <button class="modal-btn btn-save" onclick="savePreset()">保存</button>
                </div>
            </div>
        </div>
    </div>
