            /* Markdown 代码块 */
            .message-content pre, .thought-content pre {
                padding: 10px 12px;
                font-size: 12px;
            }

            /* 搜索弹窗 */
            #searchModal .modal {
                max-width: 94vw;
                margin-top: 20px;
            }
            #searchResults {
                max-height: 50vh;
            }

            /* 参数预设编辑 */
            .preset-edit-row {
                flex-wrap: wrap;
                gap: 6px;
            }
            .preset-edit-row label {
                min-width: 60px;
                font-size: 11px;
            }
            .preset-edit-row input,
            .preset-edit-row textarea,
            .preset-edit-row select {
                font-size: 14px;
            }
            .preset-slider-group .slider-label {
                font-size: 10px;
                min-width: 52px;
            }

            /* 折叠按钮 */
            .collapse-toggle {
                font-size: 11px;
                padding: 3px 10px;
            }

            /* 模式切换 */
            .mode-toggle-btn {
                padding: 4px 10px;
                font-size: 12px;
            }

            /* 生图控制面板 */
            .gen-controls-panel {
                padding: 0 10px 6px 10px;
            }
            .gen-controls-inner {
                padding: 10px 12px;
                gap: 8px;
            }
            .gen-row {
                gap: 6px;
            }
            .gen-row label {
                font-size: 11px;
                min-width: 36px;
            }
            .gen-row input[type="text"],
            .gen-row input[type="number"],
            .gen-row select {
                font-size: 12px;
                padding: 5px 8px;
            }
            .generated-images img {
                max-width: 150px;
                max-height: 150px;
            }
        }

        /* 平板中等屏幕 */
        @media (min-width: 769px) and (max-width: 1024px) {
            :root {
                --chat-max-width: 640px;
            }
            .sidebar {
                width: 220px;
                padding: 18px 12px;
            }
            .sidebar.hidden {
                width: 0;
                padding-left: 0;
                padding-right: 0;
            }
            .welcome-screen h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast">操作成功</div>

    <!-- 移动端侧边栏遮罩 -->
    <div class="sidebar-mobile-overlay" id="sidebarMobileOverlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">

                <path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.5 2.87 8.32 6.84 9.67.5.1.68-.22.68-.48 0-.24-.01-.86-.01-1.69-2.78.62-3.37-1.37-3.37-1.37-.45-1.17-1.11-1.48-1.11-1.48-.91-.64.07-.63.07-.63 1.01.07 1.54 1.06 1.54 1.06.9 1.58 2.36 1.12 2.94.86.09-.67.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.3.1-2.71 0 0 .84-.27 2.75 1.05A9.3 9.3 0 0 1 12 6.79c.85 0 1.7.12 2.5.36 1.9-1.32 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.64 1.03 2.76 0 3.94-2.34 4.81-4.58 5.06.36.32.68.95.68 1.92 0 1.38-.01 2.49-.01 2.83 0 .26.18.58.69.48A10.05 10.05 0 0 0 22 12.26C22 6.58 17.52 2 12 2Z"></path>
            </svg>
            <strong><a href="https://github.com/IIIStudio/AIChat" target="_blank" style="color:inherit;text-decoration:none;">AI Chat</a></strong> <span>@MatrixBuilder</span>
        </div>
        
        <div class="sidebar-header">
            <h2>会话</h2>
            <div class="sidebar-actions">
                <svg onclick="openSearchModal()" width="20" height="20" viewBox="0 0 24 24" title="搜索会话" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <svg onclick="toggleMultiSelect()" width="20" height="20" viewBox="0 0 24 24" title="多选" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                <svg onclick="createNewChat()" width="20" height="20" viewBox="0 0 24 24" title="新建会话" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <svg onclick="toggleSidebar()" width="20" height="20" viewBox="0 0 24 24" title="隐藏侧边栏" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
            </div>
        </div>

        <div class="multi-select-bar" id="multiSelectBar">
            <div class="ms-row-top">
                <span class="ms-count" id="msCount">已选 0 项</span>
                <div class="ms-actions-right">
                    <button class="ms-btn" onclick="selectAll()">全选</button>
                    <button class="ms-btn" onclick="toggleMultiSelect()">取消</button>
                </div>
            </div>
            <div class="ms-row-bottom">
                <button class="ms-btn" onclick="batchPin()">置顶</button>
                <button class="ms-btn" onclick="batchUnpin()">取消置顶</button>
                <button class="ms-btn danger" onclick="batchDelete()">删除</button>
            </div>
        </div>

        <div class="chat-list thin-scrollbar" id="chatList"></div>
    </div>

    <div class="main-content">
        <div class="top-nav">
            <div class="nav-left-actions">
                <svg class="sidebar-toggle-btn" id="showSidebarBtn" onclick="toggleSidebar()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                <div class="mode-toggle-wrap" id="modeToggleWrap">
                    <button class="mode-toggle-btn active" id="modeBtnChat" onclick="setMode('chat')">对话</button>
                    <button class="mode-toggle-btn" id="modeBtnGen" onclick="setMode('gen')">生图</button>

            </div>
            <div class="nav-right-actions">
                <button class="dark-mode-btn" onclick="toggleDarkMode()" title="切换深色模式">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button class="settings-btn" onclick="openSettings()">配置 API</button>

        <div class="anchor-tooltip" id="anchorTooltip"></div>

        <div class="chat-container thin-scrollbar" id="chatContainer">
            <div class="chat-inner" id="chatInner">
                <div class="welcome-screen" id="welcomeScreen">
                    <h1>AI Chat</h1>
                    <p>输入一条消息开始新的会话。</p>
                </div>
                </div>

        <div id="favPage" class="thin-scrollbar">

            <div class="fav-waterfall" id="favWaterfall"></div>

        <div class="preset-tags-area">
            <div class="preset-tags-row" id="presetTagsRow"></div>
        </div>

        <div class="gen-controls-panel" id="genControlsPanel">
            <div class="gen-controls-inner">
                <div class="gen-collapse-bar" onclick="toggleGenControls()">
                    <span>⚙ 生图参数</span>
                    <span class="gen-collapse-summary" id="genCollapseSummary" style="display:none;flex:1;text-align:right;margin-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;"></span>
                    <span class="gen-collapse-arrow" id="genCollapseArrow">▲</span>
                </div>
                <div class="gen-collapse-body" id="genCollapseBody">
                <div class="gen-row">
                    <label>反向词</label>
                    <input type="text" id="genNegativePrompt" placeholder="blurry ugly bad" maxlength="500">
                </div>
                <div class="gen-row">
                    <label>步数</label>
                    <input type="range" id="genSteps" min="1" max="50" value="9" oninput="document.getElementById('genStepsVal').textContent=this.value">
                    <span class="val-tag" id="genStepsVal">9</span>
                    <label>种子</label>
                    <input type="number" id="genSeed" value="" min="0" max="4294967295" placeholder="随机" style="width:80px;flex:none;">
                </div>
                <div class="gen-row">
                    <label>引导</label>
                    <input type="range" id="genGuidanceScale" min="0" max="20" step="0.1" value="1" oninput="document.getElementById('genGuidanceScaleVal').textContent=this.value">
                    <span class="val-tag" id="genGuidanceScaleVal">1</span>
                    <label>图尺度</label>
                    <input type="range" id="genImageScale" min="0" max="1" step="0.05" value="1" oninput="document.getElementById('genImageScaleVal').textContent=this.value">
                    <span class="val-tag" id="genImageScaleVal">1</span>
                </div>
                <div class="gen-row">
                    <label>尺寸</label>
                    <select id="genSizePreset" onchange="onGenSizeChange()" style="width:110px;flex:none;">

                        <option value="1024x768">4:3</option>
                        <option value="768x1024">3:4</option>
                        <option value="1024x576">16:9</option>
                        <option value="576x1024">9:16</option>
                        <option value="custom">自定义</option>
                    </select>
                    <span id="genCustomSize" style="display:none;gap:4px;align-items:center;">
                        <input type="number" id="genWidth" value="1024" min="64" max="2048" style="width:62px;flex:none;">
                        <span style="font-size:12px;color:var(--text-muted);">×</span>
                        <input type="number" id="genHeight" value="1024" min="64" max="2048" style="width:62px;flex:none;">
                    </span>
                </div>
                <div class="gen-row">

                        <option value="Depth">Depth</option>
                        <option value="Pose">Pose</option>

                        </span>
                    </div>
                    <div class="action-group">

                            <svg class="stop-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>

                </div>
            </div>
        </div>

    </div>

    <!-- 右侧网络搜索过程侧边栏 -->
    <div class="search-sidebar hidden" id="searchSidebar">
        <div class="search-sidebar-header">
            <span style="font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;color:var(--text-main);">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>

            </span>
            <span class="search-sidebar-close" onclick="toggleSearchSidebar(false)" title="关闭">×</span>
        </div>
        <div class="search-sidebar-content thin-scrollbar" id="searchSidebarContent">
            <div class="search-sidebar-empty">当前会话未触发网络搜索。</div>

    <script>
        // ============================================================
        //  同步初始化：防止刷新时闪烁（先于任何 DOM 渲染）
        // ============================================================
        let imageGenMode = false;
        let favMode = false;
        (function initModeSync() {
            try {
                const mode = localStorage.getItem('chatGenMode');
                if (mode === 'gen') {
                    imageGenMode = true;
                    document.documentElement.setAttribute('data-mode', 'gen');
                    const btnChat = document.getElementById('modeBtnChat');
                    const btnGen = document.getElementById('modeBtnGen');
                    const panel = document.getElementById('genControlsPanel');
                    const input = document.getElementById('userInput');
                    if (btnChat) btnChat.classList.remove('active');
                    if (btnGen) btnGen.classList.add('active');
                    if (panel) panel.classList.add('show');
                    if (input) input.placeholder = '输入图片描述词，Enter 发送';
                } else if (mode === 'fav') {
                    favMode = true;
                    document.documentElement.setAttribute('data-mode', 'fav');
                    const btnChat = document.getElementById('modeBtnChat');
                    const btnGen = document.getElementById('modeBtnGen');
                    const btnFav = document.getElementById('modeBtnFav');
                    const favPage = document.getElementById('favPage');
                    const input = document.getElementById('userInput');
                    if (btnChat) btnChat.classList.remove('active');
                    if (btnGen) btnGen.classList.remove('active');
                    if (btnFav) btnFav.classList.add('active');
                    if (favPage) favPage.classList.add('show');
                    if (input) input.placeholder = '收藏页面';
                }
            } catch(e) {}
        })();

        // ============================================================
        //  IndexedDB 存储（替代 localStorage，支持更大容量）
        // ============================================================
        const DB_NAME = 'AIChatDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'data';
        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                if (db) return resolve(db);
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains(STORE_NAME)) {
                        d.createObjectStore(STORE_NAME);
                    }
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function dbGet(key) {
            const d = await openDB();
            return new Promise((resolve, reject) => {
                const tx = d.transaction(STORE_NAME, 'readonly');
                const req = tx.objectStore(STORE_NAME).get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function dbSet(key, value) {
            const d = await openDB();
            return new Promise((resolve, reject) => {
                const tx = d.transaction(STORE_NAME, 'readwrite');
                const req = tx.objectStore(STORE_NAME).put(value, key);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        async function dbDelete(key) {
            const d = await openDB();
            return new Promise((resolve, reject) => {
                const tx = d.transaction(STORE_NAME, 'readwrite');
                const req = tx.objectStore(STORE_NAME).delete(key);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        // ============================================================
        //  收藏管理
        // ============================================================
        let favorites = [];
        let favRenderedOnce = false; // 仅在首次初始化时渲染一次

        async function loadFavorites() {
            try {
                const saved = await dbGet('favorites');
                if (saved && Array.isArray(saved)) favorites = saved;
            } catch(e) {}
        }

        async function saveFavorites() {
            try { await dbSet('favorites', favorites); } catch(e) {}
        }

        function addFavorite(src, prompt, type, model) {
            // 去重
            if (favorites.some(f => f.imageSrc === src && f.prompt === prompt)) {
                showToast('已收藏过此图片');
                return;
            }
            favorites.push({
                id: Date.now(),
                prompt: prompt,
                imageSrc: src,
                imageType: type || 'url',
                tags: [],
                model: model || '',
                addedAt: Date.now()
            });
            saveFavorites();
            // 原地追加卡片到瀑布流（避免全量重建）
            appendFavCard(favorites[favorites.length - 1]);
            showToast('已收藏');
        }

        function removeFavorite(id) {
            const numId = Number(id);
            favorites = favorites.filter(f => f.id !== numId);
            saveFavorites();
            // 原地移除卡片，不重建
            const card = document.querySelector('.fav-card[data-fav-id="' + numId + '"]');
            if (card) { card.style.transition = 'opacity 0.2s'; card.style.opacity = '0'; setTimeout(() => card.remove(), 200); }
            renderFavTagBar();
            showToast('已取消收藏');
        }

        // 标签管理
        let favFilterTag = null;
        let favTagInputCardId = null;

        function updateCardTags(card, fav) {
            const tagsDiv = card.querySelector('.fav-card-tags');
            if (!tagsDiv) return;
            const addBtn = tagsDiv.querySelector('.fav-tag-add-btn');
            tagsDiv.querySelectorAll('.fav-card-tag-badge').forEach(b => b.remove());
            if (fav.tags && fav.tags.length > 0) {
                fav.tags.forEach(tag => {
                    const b = document.createElement('span');
                    b.className = 'fav-card-tag-badge';
                    b.innerHTML = escapeHtml(tag) + '<span class="fav-tag-x" onclick="event.stopPropagation();removeTagFromFavorite(' + fav.id + ',\'' + escapeHtml(tag).replace(/'/g, "\\'") + '\')">×</span>';
                    tagsDiv.insertBefore(b, addBtn);
                });
            }
        }

        function addTagToFavorite(favId, tag) {
            tag = tag.trim().replace(/\s+/g, '');
            if (!tag) return;
            const fav = favorites.find(f => f.id === favId);
            if (!fav) return;
            if (!fav.tags) fav.tags = [];
            if (fav.tags.includes(tag)) { showToast('标签已存在'); return; }
            fav.tags.push(tag);
            saveFavorites();
            renderFavTagBar();
            const card = document.querySelector('.fav-card[data-fav-id="' + favId + '"]');
            if (card) updateCardTags(card, fav);
        }

        function removeTagFromFavorite(favId, tag) {
            const fav = favorites.find(f => f.id === favId);
            if (!fav) return;
            if (!fav.tags) return;
            fav.tags = fav.tags.filter(t => t !== tag);
            saveFavorites();
            renderFavTagBar();
            const card = document.querySelector('.fav-card[data-fav-id="' + favId + '"]');
            if (card) updateCardTags(card, fav);
        }

        function showFavTagInput(cardEl) {
            closeFavTagInput();
            const favId = Number(cardEl.getAttribute('data-fav-id'));
            favTagInputCardId = favId;
            const fav = favorites.find(f => f.id === favId);
            const currentTags = (fav && fav.tags) ? fav.tags : [];

            // 收集所有已有标签（去重）
            const allTags = {};
            favorites.forEach(f => {
                if (f.tags) f.tags.forEach(t => { allTags[t] = (allTags[t] || 0) + 1; });
            });
            // 排除当前卡片已有的标签
            const suggested = Object.entries(allTags)
                .filter(([t]) => !currentTags.includes(t))
                .sort((a, b) => b[1] - a[1])
                .map(([t]) => t);

            const popup = document.createElement('div');
            popup.className = 'fav-tag-input-popup';
            popup.id = 'favTagInputPopup';
            popup.onclick = (e) => e.stopPropagation();

            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = '输入或选择标签';
            input.maxLength = 20;

            const suggestList = document.createElement('div');
            suggestList.className = 'fav-tag-suggest-list';

            function renderSuggestions(filter) {
                suggestList.innerHTML = '';
                const list = filter ? suggested.filter(t => t.toLowerCase().includes(filter.toLowerCase())) : suggested;
                if (list.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'fav-tag-suggest-empty';
                    empty.textContent = filter ? '按下 Enter 创建新标签' : '暂无已有标签';
                    suggestList.appendChild(empty);
                } else {
                    list.forEach(tag => {
                        const item = document.createElement('div');
                        item.className = 'fav-tag-suggest-item';
                        item.textContent = tag;
                        item.onclick = () => {
                            addTagToFavorite(favId, tag);
                            closeFavTagInput();
                        };
                        suggestList.appendChild(item);
                    });
                }
            }

            input.onkeydown = function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const val = input.value.trim().replace(/\s+/g, '');
                    if (val) {
                        if (currentTags.includes(val)) { showToast('标签已存在'); closeFavTagInput(); return; }
                        addTagToFavorite(favId, val);
                    }
                    closeFavTagInput();
                }
                if (e.key === 'Escape') { closeFavTagInput(); }
                e.stopPropagation();
            };
            input.oninput = () => renderSuggestions(input.value.trim());

            popup.appendChild(input);
            popup.appendChild(suggestList);
            document.body.appendChild(popup);

            // 使用 fixed 定位，根据卡片位置计算弹窗坐标
            function repositionPopup() {
                const rect = cardEl.getBoundingClientRect();
                const popupWidth = popup.offsetWidth || 180;
                const popupHeight = popup.offsetHeight || 40;
                // 弹窗默认显示在卡片底部下方
                let top = rect.bottom + 6;
                let left = rect.left + 8;
                // 如果底部空间不够，弹窗从卡片底部向上展开（标签上方，而非图片上方）
                if (top + popupHeight > window.innerHeight - 8) {
                    top = rect.bottom - popupHeight - 6;
                }
                // 不超出左右边界
                if (left + popupWidth > window.innerWidth - 8) left = window.innerWidth - popupWidth - 8;
                if (left < 8) left = 8;
                // 如果上方也不够，贴窗口顶部
                if (top < 4) top = 4;
                popup.style.top = top + 'px';
                popup.style.left = left + 'px';
            }
            repositionPopup();

            // 渲染建议后重新定位
            const origRender = renderSuggestions;
            renderSuggestions = function(filter) {
                origRender(filter);
                setTimeout(repositionPopup, 10);
            };

            renderSuggestions('');
            setTimeout(() => { input.focus(); }, 50);
        }

        function closeFavTagInput() {
            const p = document.getElementById('favTagInputPopup');
            if (p) p.remove();
            favTagInputCardId = null;
        }

        // 点击外部关闭标签输入
        document.addEventListener('click', function(e) {
            if (favTagInputCardId !== null && !e.target.closest('#favTagInputPopup') && !e.target.closest('.fav-tag-add-btn')) {
                closeFavTagInput();
            }
        });

        function filterByTag(tag) {
            if (favFilterTag === tag) {
                favFilterTag = null;
            } else {
                favFilterTag = tag;
            }
            renderFavorites();
        }

        function getFilteredFavorites() {
            if (!favFilterTag) return favorites.slice();
            return favorites.filter(f => f.tags && f.tags.includes(favFilterTag));
        }

        function renderFavTagBar() {
            const bar = document.getElementById('favTagBar');
            if (!bar) return;
            bar.innerHTML = '';
            if (favorites.length === 0) return;

            const tagCounts = {};
            favorites.forEach(f => {
                if (f.tags) f.tags.forEach(t => {
                    tagCounts[t] = (tagCounts[t] || 0) + 1;
                });
            });
            const sorted = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]);
            if (sorted.length === 0) return;

            sorted.forEach(([tag, count]) => {
                const chip = document.createElement('span');
                chip.className = 'fav-tag-chip' + (favFilterTag === tag ? ' active' : '');
                chip.textContent = tag + '（' + count + '）';
                chip.onclick = () => filterByTag(tag);
                bar.appendChild(chip);
            });

            if (favFilterTag) {
                const clear = document.createElement('span');
                clear.className = 'fav-tag-chip';
                clear.textContent = '✕ 全部';
                clear.onclick = () => filterByTag(favFilterTag);
                bar.appendChild(clear);
            }
        }

        function downloadFavImage(imageSrc) {
            const a = document.createElement('a');
            a.href = imageSrc;
            a.download = 'favorite-image.png';
            a.click();
        }

        function copyFavPrompt(prompt) {
            navigator.clipboard.writeText(prompt).then(() => {
                showToast('提示词已复制');
            }).catch(() => {
                showToast('复制失败');
            });
        }

        // 创建单张收藏卡片（公共函数，用于渲染和追加）
        function createFavCard(fav, index) {
            const card = document.createElement('div');
            card.className = 'fav-card';
            card.style.animationDelay = (index * 0.05) + 's';
            card.setAttribute('data-fav-id', fav.id);
            card.setAttribute('data-fav-prompt', fav.prompt);
            card.setAttribute('data-fav-src', fav.imageSrc);

            const overlay = document.createElement('div');
            overlay.className = 'fav-card-overlay';

            const downloadBtn = document.createElement('button');
            downloadBtn.title = '下载图片';
            downloadBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>';
            downloadBtn.onclick = function(e) { e.stopPropagation(); downloadFavImage(card.getAttribute('data-fav-src')); };

            const copyBtn = document.createElement('button');
            copyBtn.title = '复制提示词';
            copyBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
            copyBtn.onclick = function(e) { e.stopPropagation(); copyFavPrompt(card.getAttribute('data-fav-prompt')); };

            const unfavBtn = document.createElement('button');
            unfavBtn.title = '取消收藏';
            unfavBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="fill:none;pointer-events:none;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>';
            unfavBtn.onclick = function(e) { e.stopPropagation(); removeFavorite(card.getAttribute('data-fav-id')); };

            const genBtn = document.createElement('button');
            genBtn.title = '发送提示词到生图';
            genBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>';
            genBtn.onclick = function(e) { e.stopPropagation(); setMode('gen'); userInput.value = fav.prompt; userInput.style.height = 'auto'; userInput.style.height = userInput.scrollHeight + 'px'; userInput.focus(); showToast('已填入提示词'); };

            overlay.appendChild(downloadBtn);
            overlay.appendChild(copyBtn);
            overlay.appendChild(genBtn);
            overlay.appendChild(unfavBtn);

            const tagsDiv = document.createElement('div');
            tagsDiv.className = 'fav-card-tags';
            const tagAddBtn = document.createElement('div');
            tagAddBtn.className = 'fav-tag-add-btn';
            tagAddBtn.textContent = '+';
            tagAddBtn.title = '添加标签';
            tagAddBtn.onclick = function(e) { e.stopPropagation(); showFavTagInput(card); };
            tagsDiv.appendChild(tagAddBtn);
            if (fav.tags && fav.tags.length > 0) {
                fav.tags.forEach(tag => {
                    const b = document.createElement('span');
                    b.className = 'fav-card-tag-badge';
                    b.innerHTML = escapeHtml(tag) + '<span class="fav-tag-x" onclick="event.stopPropagation();removeTagFromFavorite(' + fav.id + ',\'' + escapeHtml(tag).replace(/'/g, "\\'") + '\')">×</span>';
                    tagsDiv.appendChild(b);
                });
            }

            const img = document.createElement('img');
            img.src = fav.imageSrc;
            img.loading = 'lazy';
            img.alt = '';
            img.onclick = function() { previewGenImage(fav.imageSrc); };
            img.onerror = function() { this.src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150"><rect fill="#ddd" width="200" height="150"/><text x="50%" y="50%" text-anchor="middle" dy=".3em" fill="#999" font-size="12">图片失效</text></svg>'); };

            card.appendChild(overlay);

            if (fav.model) {
                const modelBadge = document.createElement('div');
                modelBadge.className = 'fav-card-model-badge';
                const logo = getLogoForModel(fav.model);

            // 如果瀑布流是空状态提示，先清除

            const waterfall = document.getElementById('favWaterfall');
            if (!waterfall) return;
            closeFavTagInput();

            if (favorites.length === 0) {
                waterfall.innerHTML = '<div class="fav-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><h3>暂无收藏</h3><p>在生图模式下点击图片旁的 ❤ 即可收藏</p></div>';

                waterfall.innerHTML = '<div class="fav-empty"><h3>该标签下无收藏</h3></div>';
                return;
            }
            const batchSize = 10;
            let i = 0;
            function renderBatch() {
                const batch = allFavs.slice(i, i + batchSize);

        function copyMessageText(btnElement) {
            const block = btnElement.closest('.message-block');
            const contentEl = block.querySelector('.message-content');
            // 优先复制原始 Markdown 内容（存在 data-raw 属性时）
            let content = contentEl.getAttribute('data-raw');
            if (!content) {
                // 回退：从 data-index 获取消息内容
                const idx = parseInt(contentEl.getAttribute('data-index'));
                if (!isNaN(idx)) {
                    const session = sessions.find(s => s.id === getCurrentId());
                    if (session && session.messages[idx]) {
                        const msg = session.messages[idx];
                        // 生图消息：复制提示词而非 HTML
                        if (msg.isHtml && msg.genPrompt) {
                            content = msg.genPrompt;
                        } else if (Array.isArray(msg.content)) {
                            content = msg.content.filter(c => c.type === 'text').map(c => c.text).join('\n');
                        } else {
                            content = msg.content;
                        }
                    }
                }
                if (!content) {
                    content = contentEl.textContent;
                }
            }
            content = content.replace(/\n{3,}/g, '\n\n').trim();
            navigator.clipboard.writeText(content).then(() => { showToast('已复制到剪贴板'); })
            .catch(() => { showToast('复制失败，请重试'); });
        }

        async function loadProviders() {
            try {
                const saved = await dbGet('providers');
                if (saved) {
                    providers = saved.providers || [];
                    activeProviderId = saved.activeProviderId || null;
                    activeModel = saved.activeModel || '';
                    providers = providers.map(p => {
                        if (p.model && !p.models) { p.models = [p.model]; delete p.model; }
                        if (!p.models) p.models = [];
                        return p;
                    });
                }
            } catch(e) {}
            if (providers.length === 0) {
                const defaultId = Date.now();
                providers.push({ id: defaultId, name: '默认', apiUrl: 'https://token-plan-cn.xiaomimimo.com/v1', apiKey: '', models: ['mimo-v2.5-pro', 'mimo-v2.5'] });
                providers.push({ id: defaultId + 1, name: 'Gitee AI', apiUrl: 'https://ai.gitee.com/v1', apiKey: '', models: ['z-image-turbo'] });
                activeProviderId = defaultId;
                activeModel = 'mimo-v2.5-pro';
            } else {
                if (!providers.find(p => p.id === activeProviderId)) {
                    activeProviderId = providers[0]?.id || null;
                    activeModel = (providers[0]?.models && providers[0].models[0]) || '';
                }
                if (!activeModel) {
                    const ap = providers.find(p => p.id === activeProviderId);
                    activeModel = (ap?.models && ap.models[0]) || '';
                }
            }
            saveProvidersToStorage();
        }

        // 渲染过滤后的模型列表项
        function renderModelDropdownItems(dropdown, filterText) {
            // 移除旧列表项（保留搜索框）
            Array.from(dropdown.children).forEach(c => { if (!c.classList.contains('model-search-wrap')) c.remove(); });
            const ft = (filterText || '').toLowerCase().trim();
            const filtered = [];
            providers.forEach(p => {
                (p.models || []).forEach(m => {
                    const isGen = isGenModel(m);
                    if (imageGenMode ? isGen : !isGen) {
                        // 搜索过滤：匹配模型名或运营商名
                        if (ft && !m.toLowerCase().includes(ft) && !p.name.toLowerCase().includes(ft)) return;
                        const logo = getModelDevLogo(p.name, p.apiUrl, m);
                        filtered.push({ pid: p.id, pname: p.name, model: m, logo });
                    }
                });
            });
            if (filtered.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'model-dropdown-item';
                empty.style.color = 'var(--text-muted)';
                empty.style.cursor = 'default';
                empty.textContent = '无匹配模型';
                dropdown.appendChild(empty);
                return;

        // ============================================================
        //  思考等级切换 — 覆盖 auto/max/xhigh/high/medium/low/none
        //  auto 为默认，不向请求体注入 thinking 字段，交由模型/接口默认行为
        // ============================================================
        // 思考等级枚举：value 为下发到请求体的 thinking 值，label 为界面展示文案
        const THINKING_LEVELS = [
            { value: 'auto',   label: '自动' },
            { value: 'max',    label: '最高' },
            { value: 'xhigh',  label: '极高' },
            { value: 'high',   label: '高' },

        // 从 localStorage 恢复思考等级，校验非法值时回退为 auto
        function loadThinkingLevel() {
            thinkingDropdownEl = document.getElementById('thinkingDropdown');
            try {
                const saved = localStorage.getItem('chatThinkingLevel');
                if (saved && THINKING_LEVELS.some(l => l.value === saved)) thinkingLevel = saved;
            } catch(e) {}
            updateThinkingDisplay();
        }

        // 持久化当前思考等级
        function saveThinkingLevel() {
            try { localStorage.setItem('chatThinkingLevel', thinkingLevel); } catch(e) {}

        // 更新按钮展示文案与选中态
        function updateThinkingDisplay() {
            const labelEl = document.getElementById('thinkingLabel');
            if (labelEl) {
                const found = THINKING_LEVELS.find(l => l.value === thinkingLevel);
                labelEl.textContent = found ? found.label : '自动';
            }
            if (!thinkingDropdownEl) return;
            Array.from(thinkingDropdownEl.children).forEach(child => {
                child.classList.toggle('active', child.dataset.value === thinkingLevel);
            });
        }

        // 渲染思考等级下拉列表
        function renderThinkingDropdown() {
            if (!thinkingDropdownEl) return;
            thinkingDropdownEl.innerHTML = '';
            THINKING_LEVELS.forEach(l => {
                const div = document.createElement('div');
                div.className = 'thinking-dropdown-item' + (l.value === thinkingLevel ? ' active' : '');
                div.dataset.value = l.value;
                // auto 标注“默认”，none 标注“停用”，其余标注 value 原值便于辨识
                const hint = l.value === 'auto' ? '默认' : (l.value === 'none' ? '停用' : l.value);
                div.innerHTML = `<span>${l.label}</span><span class="thinking-hint">${hint}</span>`;

        // ============================================================
        //  models.dev Logo 匹配
        // ============================================================
        function getModelDevLogo(providerName, apiUrl, modelName) {
            const k = (providerName || '').toLowerCase() + '|' + (apiUrl || '').toLowerCase() + '|' + (modelName || '').toLowerCase();
            const candidates = [
                ['openai',     ['openai', 'gpt-', 'chatgpt', 'o1', 'o3', 'o4']],
                ['anthropic',  ['anthropic', 'claude']],
                ['google',     ['google', 'gemini', 'gemma', 'generativelanguage', 'palm']],
                ['deepseek',   ['deepseek']],
                ['mistral',    ['mistral', 'ministral', 'codestral']],
                ['meta',       ['meta', 'llama', 'llama3', 'llama4']],
                ['alibaba',    ['alibaba', 'qwen', 'tongyi', 'dashscope', 'z-image']],
                ['zhipuai',    ['zhipu', 'glm', 'chatglm', 'bigmodel']],
                ['moonshot',   ['moonshot', 'kimi']],
                ['xai',        ['x.ai', 'xai', 'grok']],
                ['minimax',    ['minimax']],
                ['baidu',      ['baidu', 'ernie', 'wenxin', 'qianfan']],
                ['bytedance',  ['bytedance', 'doubao', 'volcengine', 'volc', 'ark']],
                ['cohere',     ['cohere', 'command']],
                ['groq',       ['groq']],
                ['fireworks',  ['fireworks']],
                ['perplexity', ['perplexity', 'pplx', 'sonar']],
                ['replicate',  ['replicate']],
                ['together',   ['together']],
                ['cerebras',   ['cerebras']],
                ['upstage',    ['upstage', 'solar']],
                ['xiaomi',     ['xiaomi', 'xiaomimimo', 'mimo']],
                ['nvidia',     ['nvidia', 'nvapi', 'nemotron']],
                ['iflowcn',    ['iflow']],
                ['stepfun',    ['stepfun', 'step-']],
                ['huggingface',['huggingface', 'hf.co']],
                ['tencent',    ['tencent', 'hunyuan', 'hy', 'tencentcloud']],
            ];
            for (const [pid, patterns] of candidates) {
                for (const pat of patterns) {
                    if (k.includes(pat)) {
                        return `https://models.dev/logos/${encodeURIComponent(pid)}.svg`;
                    }
                }
            }
            return null;
        }

        function getLogoForModel(modelName) {
            for (const p of providers) {
                if (p.models && p.models.includes(modelName)) {

                }
            }
            return null;
        }

        function showAddModelInput() {
            const list = document.getElementById('editModelsList');
            if (!list) return;
            const btn = list.querySelector('.tag-add-btn');

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'tag-add-input';
            input.placeholder = '输入模型名';
            let committed = false;
            const commit = () => { if (committed) return; committed = true; commitNewModel(input); };
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); commit(); } });
            input.addEventListener('blur', () => { setTimeout(commit, 120); });
            list.appendChild(input);
            input.focus();

        function commitNewModel(input) {
            flushEditingProvider();
            const val = input.value.trim();
            if (val) {
                const p = providers.find(p => p.id === editingProviderId);
                if (p) { if (!p.models) p.models = []; p.models.push(val); }
            }
            renderSettingsRight();
        }

        async function fetchModels() {
            flushEditingProvider();
            const p = providers.find(p => p.id === editingProviderId);
            if (!p) { showToast('请先选择一个运营商'); return; }
            let baseUrl = (p.apiUrl || '').trim().replace(/\/+$/, '');
            // 去掉 /chat/completions 后缀，得到 base URL
            if (baseUrl.endsWith('/chat/completions')) {
                baseUrl = baseUrl.slice(0, -'/chat/completions'.length);
            }
            const modelsUrl = baseUrl + '/models';
            try {
                const res = await fetch(modelsUrl, {
                    headers: { 'Authorization': `Bearer ${p.apiKey || ''}` }
                });
                if (!res.ok) {
                    const errText = await res.text().catch(() => '');
                    throw new Error(`HTTP ${res.status}${errText ? ': ' + errText.slice(0, 100) : ''}`);
                }
                const data = await res.json();
                // 兼容 OpenAI 格式: { data: [{ id: '...' }, ...] }
                // 也兼容直接返回数组的格式
                let modelIds = [];
                if (Array.isArray(data.data)) {
                    modelIds = data.data.map(item => item.id).filter(Boolean);
                } else if (Array.isArray(data)) {
                    modelIds = data.map(item => item.id || item).filter(Boolean);
                }
                if (modelIds.length === 0) { showToast('未获取到模型列表'); return; }
                // 去重并保留原有手动添加但不在返回列表中的模型
                const existing = (p.models || []).filter(m => !modelIds.includes(m));
                p.models = [...modelIds, ...existing];
                renderSettingsRight();
                showToast(`已获取 ${modelIds.length} 个模型`);
            } catch (err) {
                showToast('获取失败: ' + (err.message || '未知错误'));
            }
        }

        function importProviders(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.providers || !Array.isArray(data.providers)) throw new Error('无效格式');
                    data.providers = data.providers.map(p => {
                        if (p.model && !p.models) { p.models = [p.model]; delete p.model; }
                        if (!p.models) p.models = [];
                        return p;
                    });
                    providers = data.providers;
                    activeProviderId = data.activeProviderId || providers[0]?.id || null;
                    activeModel = data.activeModel || (providers[0]?.models && providers[0].models[0]) || '';
                    if (!providers.find(p => p.id === activeProviderId)) {
                        activeProviderId = providers[0]?.id || null;
                        activeModel = (providers[0]?.models && providers[0].models[0]) || '';
                    }
                    editingProviderId = activeProviderId;
                    providersBackup = deepClone({ providers, activeProviderId, activeModel });
                    renderSettingsLeft();
                    renderSettingsRight();
                    updateModelDisplay();
                    renderModelDropdown();
                    saveProvidersToStorage();
                    // 恢复预设
                    if (data.paramPresets && Array.isArray(data.paramPresets)) {
                        paramPresets = data.paramPresets;
                        activePresetId = data.activePresetId || paramPresets[0]?.id || null;
                        if (!paramPresets.find(p => p.id === activePresetId)) activePresetId = paramPresets[0]?.id || null;
                        savePresets();
                        renderPresetTags();
                    }
                    // 恢复会话
                    if (data.sessions && Array.isArray(data.sessions)) {
                        sessions = data.sessions;
                        currentChatSessionId = data.currentChatSessionId || sessions[0]?.id || null;
                        currentGenSessionId = data.currentGenSessionId || null;
                        if (!sessions.find(s => s.id === currentChatSessionId)) {
                            currentChatSessionId = sessions.find(s => s.type === 'chat')?.id || sessions[0]?.id || null;
                        }
                        if (!sessions.find(s => s.id === currentGenSessionId)) {
                            currentGenSessionId = sessions.find(s => s.type === 'gen')?.id || null;
                        }
                        saveSessionsToStorage();
                        lastRenderedSessionId = null; // 导入后强制重建
                        switchChat(getCurrentId());
                    }
                    // 恢复收藏
                    if (data.favorites && Array.isArray(data.favorites)) {
                        favorites = data.favorites.map(f => {
                            if (!f.tags) f.tags = [];
                            return f;
                        });
                        saveFavorites();
                        if (favMode) renderFavorites();
                    }
                    showToast(`已导入 (${providers.length}个运营商, ${sessions.length}个会话, ${favorites.length}个收藏)`);
                } catch(err) {
                    showToast('导入失败: JSON 格式不正确');
                }
            };
            reader.readAsText(file);
            input.value = '';
        }
