        // 【流式渲染/系统】【辅助函数】判断一个代码块是否已经完全闭合
        function isCodeBlockClosed(codeEl) {
            const pre = codeEl.parentElement;
            if (!pre || pre.tagName !== 'PRE') return false;
            // 如果 pre 后面还有任何兄弟节点，说明大模型已开始输出后续内容，该代码块必然已闭合
            if (pre.nextSibling) return true;
            return false;
        }

        // ============================================================
        //  代码高亮 — 统一处理 marked 与 smd 两条路径的代码块
        // ============================================================
        // 对容器内 <pre><code> 元素调用 hljs 着色，并添加语言标记与复制按钮
        // 传参：container 为待处理的 DOM 容器
        //       skipLast 为 true 时跳过最后一个未闭合的代码块（流式中可能未完成）
        // 返回：无
        function highlightCodeBlocks(container, skipLast = false) {
            if (!container || !window.hljs) return;
            // 1.收集未着色的代码块
            const codeEls = Array.from(container.querySelectorAll('pre > code:not(.hljs)'));
            const end = codeEls.length;
            for (let i = 0; i < end; i++) {
                const el = codeEls[i];
                // 2.skipLast 模式下，若为最后一块且尚未闭合，则跳过（流式输出中可能尚未完成）
                if (skipLast && i === end - 1 && !isCodeBlockClosed(el)) {
                    continue;
                }
                // 3.提取语言名：兼容 marked 的 language-xxx 和 smd 的直接语言名
                const langMatch = el.className.match(/(?:language-)?(\w+)/);
                const lang = langMatch ? langMatch[1] : null;
                try {
                    if (lang && hljs.getLanguage(lang)) {
                        el.innerHTML = hljs.highlight(el.textContent, { language: lang }).value;
                    } else {
                        el.innerHTML = hljs.highlightAuto(el.textContent).value;
                    }
                    el.classList.add('hljs');
                } catch(e) { continue; }
                // 4.为代码块添加语言标记与复制按钮包装器
                const pre = el.parentElement;
                if (pre && pre.tagName === 'PRE' && !pre.parentElement?.classList.contains('code-block-wrapper')) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'code-block-wrapper';
                    const header = document.createElement('div');
                    header.className = 'code-block-header';
                    // 5.语言标记：有语言用语言名，无语言显示"代码"
                    const langLabel = document.createElement('span');
                    langLabel.className = 'code-lang';
                    langLabel.textContent = lang || '代码';
                    // 6.复制按钮
                    const copyBtn = document.createElement('span');
                    copyBtn.className = 'code-copy-btn';
                    copyBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> 复制';
                    copyBtn.onclick = () => {
                        const text = el.textContent;
                        navigator.clipboard.writeText(text).then(() => {
                            copyBtn.classList.add('copied');
                            copyBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg> 已复制';
                            setTimeout(() => {
                                copyBtn.classList.remove('copied');
                                copyBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> 复制';
                            }, 2000);
                        }).catch(() => showToast('复制失败'));
                    };
                    header.appendChild(langLabel);
                    header.appendChild(copyBtn);
                    // 7.将 pre 移入 wrapper，替换原位置
                    pre.parentNode.insertBefore(wrapper, pre);
                    wrapper.appendChild(header);
                    wrapper.appendChild(pre);
                }
            }
        }

        // ============================================================
        //  数学公式预处理 — 剥离包裹公式的反引号
        // ============================================================
        // 模型常以 `$...$` 或 `$$...$$` 形式输出公式，反引号会被 markdown
        // 解析为行内代码 <code>，导致 KaTeX 扩展无法识别其中的 $ 定界符
        // 此函数把包裹公式的反引号剥离，使 $...$ / $$...$$ 暴露给公式解析器
        // 传参：text 为原始 markdown 文本
        // 返回：剥离反引号后的文本
        function unwrapMathFromCode(text) {
            if (!text) return text;
            // 匹配 `$$...$$` 或 `$...$` 形式，反引号紧贴 $ 前后
            // 注意 $$ 优先于 $ 匹配，避免误拆
            return text
                .replace(/`(\$\$[^`]*?\$\$)`/g, '$1')
                .replace(/`(\$[^`]*?\$)`/g, '$1');
        }

        // ============================================================
        //  数学公式渲染 — 统一处理 smd 与 marked 两条路径
        // ============================================================
        // 对容器内公式调用 KaTeX 渲染，兼容两种来源：
        // 1. streaming-markdown 生成的 <equation-inline>/<equation-block> 自定义元素
        // 2. marked 输出 DOM 中残留的 $...$、$$...$$、\(...\)、\[...\] 定界符
        //    用 KaTeX auto-render 扫描文本节点渲染，不受 markdown 解析阶段限制
        // 传参：container 为待渲染的 DOM 容器
        // 返回：无
        function renderMath(container) {
            if (!container || !window.katex) return;
            // 1.渲染 smd 生成的 equation 自定义元素，已处理的跳过
            container.querySelectorAll('equation-inline:not([data-katex])').forEach(el => {
                const tex = el.textContent;
                if (tex) {
                    try { katex.render(tex, el, { displayMode: false, throwOnError: false }); } catch(e) {}
                    el.setAttribute('data-katex', '1');
                }
            });
            container.querySelectorAll('equation-block:not([data-katex])').forEach(el => {
                const tex = el.textContent;
                if (tex) {
                    try { katex.render(tex, el, { displayMode: true, throwOnError: false }); } catch(e) {}
                    el.setAttribute('data-katex', '1');
                }
            });
            // 2.用 auto-render 扫描 marked 路径残留的定界符公式
            if (window.renderMathInElement) {
                try {
                    renderMathInElement(container, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '\\[', right: '\\]', display: true },
                            { left: '\\(', right: '\\)', display: false },
                            { left: '$', right: '$', display: false }
                        ],
                        throwOnError: false
                    });
                } catch(e) {}
            }
        }

        // ============================================================
        //  Mermaid 图表渲染与视图切换
        // ============================================================
        // 切换 Mermaid 视图模式
        window.switchMermaidTab = function(wrapper, mode) {
            if (!wrapper) return;
            const btnPreview = wrapper.querySelector('.mermaid-toolbar .mermaid-tool-btn:nth-child(1)');
            const btnCode = wrapper.querySelector('.mermaid-toolbar .mermaid-tool-btn:nth-child(2)');
            const previewDiv = wrapper.querySelector('.mermaid-preview');
            const codeDiv = wrapper.querySelector('.mermaid-code');

            if (mode === 'preview') {
                btnPreview?.classList.add('active');
                btnCode?.classList.remove('active');
                if (previewDiv) previewDiv.style.display = 'flex';
                if (codeDiv) codeDiv.style.display = 'none';
            } else if (mode === 'code') {
                btnPreview?.classList.remove('active');
                btnCode?.classList.add('active');
                if (previewDiv) previewDiv.style.display = 'none';
                if (codeDiv) codeDiv.style.display = 'block';
            }
        };

        function renderMermaid(container, skipLast = false) {
            if (!container || !window.mermaid) return;
            const codeEls = Array.from(container.querySelectorAll('pre > code.mermaid-raw, pre > code.language-mermaid'));
            if (codeEls.length === 0) return;

            const end = codeEls.length;
            for (let i = 0; i < end; i++) {
                const el = codeEls[i];
                const pre = el.parentElement;
                if (!pre || pre.tagName !== 'PRE') continue;
                if (pre.closest('.mermaid-wrapper')) continue;

                // 【流式渲染/系统】【增量渲染】skipLast 模式下，若为最后一个 Mermaid 块且尚未闭合，则跳过中途渲染
                if (skipLast && i === end - 1 && !isCodeBlockClosed(el)) {
                    continue;
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'mermaid-wrapper';
                // 1. 创建工具栏
                const toolbar = document.createElement('div');
                toolbar.className = 'mermaid-toolbar';

                const btnPreview = document.createElement('span');
                btnPreview.className = 'mermaid-tool-btn active';
                btnPreview.textContent = '图表';
                btnPreview.onclick = () => switchMermaidTab(wrapper, 'preview');

                const btnCode = document.createElement('span');
                btnCode.className = 'mermaid-tool-btn';
                btnCode.textContent = '源码';
                btnCode.onclick = () => switchMermaidTab(wrapper, 'code');

                const btnCopy = document.createElement('span');
                btnCopy.className = 'mermaid-tool-copy';
                btnCopy.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> 复制';
                btnCopy.onclick = () => {
                    navigator.clipboard.writeText(el.textContent).then(() => {
                        btnCopy.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg> 已复制';
                        setTimeout(() => {
                            btnCopy.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> 复制';
                        }, 2000);
                    });
                };

                toolbar.appendChild(btnPreview);
                toolbar.appendChild(btnCode);
                toolbar.appendChild(btnCopy);

                // 2. 创建图表预览区域
                const previewDiv = document.createElement('div');
                previewDiv.className = 'mermaid-preview';
                
                const mermaidDiv = document.createElement('div');
                mermaidDiv.className = 'mermaid';
                mermaidDiv.textContent = el.textContent;
                previewDiv.appendChild(mermaidDiv);

                // 3. 创建源码框
                const codeDiv = document.createElement('div');
                codeDiv.className = 'mermaid-code';
                codeDiv.style.display = 'none';

                const preNode = document.createElement('pre');
                const codeNode = document.createElement('code');
                codeNode.className = 'mermaid-source-text hljs';
                if (window.hljs) {
                    try { codeNode.innerHTML = hljs.highlightAuto(el.textContent).value; } 
                    catch(e) { codeNode.textContent = el.textContent; }
                } else {
                    codeNode.textContent = el.textContent;
                }
                preNode.appendChild(codeNode);
                codeDiv.appendChild(preNode);

                wrapper.appendChild(toolbar);
                wrapper.appendChild(previewDiv);
                wrapper.appendChild(codeDiv);

                // 检查并替换可能已存在的高亮包装容器 code-block-wrapper，避免残留 header 栏
                let targetToReplace = pre;
                if (pre.parentNode && pre.parentNode.classList.contains('code-block-wrapper')) {
                    targetToReplace = pre.parentNode;
                }

                targetToReplace.parentNode.replaceChild(wrapper, targetToReplace);
            }

            try {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                mermaid.initialize({
                    startOnLoad: false,
                    theme: isDark ? 'dark' : 'default',
                    securityLevel: 'loose'
                });
                mermaid.run({
                    nodes: Array.from(container.querySelectorAll('.mermaid'))
                });
            } catch (err) {
                console.error("Mermaid 渲染错误: ", err);
            }
        }

        // ============================================================
        //  SSE 流式读取
        // ============================================================
        // 读取 SSE 流，分别累积正文 content 与思考 reasoning_content
        // 传参：body 为响应流，el 为正文展示元素
        // 返回：{ content, thought }，为原始 markdown 文本用于持久化
        // 优先使用 streaming-markdown 增量渲染，库未就绪时回退纯文本
        async function readSSEStream(body, el) {
            const reader = body.getReader();
            const decoder = new TextDecoder();
            let full = '', thoughtFull = '', buf = '';
            let toolCalls = []; // 【网络搜索/TinyFish】【智能代理】收集流式 tool_calls 增量
            // 1.定位思考过程展示元素与容器
            const thoughtEl = el.closest('.message-block')?.querySelector('.thought-content');
            const thoughtProcessEl = el.closest('.message-block')?.querySelector('.thought-process');
            let thoughtStarted = false;
            // 2.创建流式 markdown 解析器：正文与思考各一个
            const useSmd = !!window.smd;
            let contentParser = null, thoughtParser = null;
            if (useSmd) {
                contentParser = window.smd.parser(window.smd.default_renderer(el));
                if (thoughtEl) thoughtParser = window.smd.parser(window.smd.default_renderer(thoughtEl));
            } else {
                // 回退：纯文本需要保留换行
                el.style.whiteSpace = 'pre-wrap';
                if (thoughtEl) thoughtEl.style.whiteSpace = 'pre-wrap';
            }
            // 3.流式着色节流：每 600ms 对已完成代码块着色一次
            let lastHighlightTime = 0;
            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buf += decoder.decode(value, { stream: true });
                    const lines = buf.split('\n');
                    buf = lines.pop() || '';
                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const payload = line.slice(6).trim();
                        if (!payload || payload === '[DONE]') continue;
                        try {
                            const deltaObj = JSON.parse(payload).choices?.[0]?.delta;
                            if (!deltaObj) continue;
                            // 4.累积并增量渲染思考内容
                            if (deltaObj.reasoning_content) {
                                // 首次收到思考内容时：把"思考中"动效替换为"思考过程"标题
                                if (!thoughtStarted) {
                                    thoughtStarted = true;
                                    if (thoughtEl) thoughtEl.innerHTML = '';
                                    if (thoughtProcessEl) {
                                        thoughtProcessEl.classList.add('thinking');
                                        // 更新 bar：跳动点→折叠箭头，标签改为"思考过程"
                                        const bar = thoughtProcessEl.querySelector('.thought-bar');
                                        if (bar) bar.innerHTML = '<span class="thought-label">思考过程</span><svg class="thought-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>';
                                    }
                                }
                                thoughtFull += deltaObj.reasoning_content;
                                if (thoughtParser) window.smd.parser_write(thoughtParser, unwrapMathFromCode(deltaObj.reasoning_content));
                                else if (thoughtEl) thoughtEl.textContent = thoughtFull;
                            }
                            // 5.累积并增量渲染正文内容
                            if (deltaObj.content) {
                                // 【流式渲染/系统】【正文渲染】一旦开始收到正文，说明思考阶段已结束，立即移除“思考中”动效
                                if (thoughtProcessEl && thoughtProcessEl.classList.contains('thinking') && !thoughtStarted) {
                                    thoughtProcessEl.remove();
                                }
                                full += deltaObj.content;
                                if (contentParser) window.smd.parser_write(contentParser, unwrapMathFromCode(deltaObj.content));
                                else el.textContent = full;
                            }
                            // 【网络搜索/TinyFish】【智能代理】收集流式 tool_calls 增量数据
                            if (deltaObj.tool_calls) {
                                deltaObj.tool_calls.forEach(tc => {
                                    const idx = tc.index;
                                    if (!toolCalls[idx]) {
                                        toolCalls[idx] = {
                                            id: tc.id || '',
                                            type: tc.type || 'function',
                                            function: {
                                                name: tc.function?.name || '',
                                                arguments: tc.function?.arguments || ''
                                            }
                                        };
                                    } else {
                                        if (tc.id) toolCalls[idx].id = tc.id;
                                        if (tc.function?.name) toolCalls[idx].function.name = tc.function.name;
                                        if (tc.function?.arguments) toolCalls[idx].function.arguments += tc.function.arguments;
                                    }
                                });
                            }
                        } catch(e) {}
                    }
                    // 【流式渲染/系统】【增量渲染】6. 增量渲染节流：每 600ms 对已闭合的代码高亮、数学公式与 Mermaid 视图进行中途渲染
                    const now = Date.now();
                    if (useSmd && now - lastHighlightTime > 600) {
                        lastHighlightTime = now;
                        highlightCodeBlocks(el, true);
                        renderMath(el);
                        renderMermaid(el, true);
                        if (thoughtEl) {
                            highlightCodeBlocks(thoughtEl, true);
                            renderMath(thoughtEl);
                            renderMermaid(thoughtEl, true);
                        }
                    }
                    // 流式输出时持续滚动到底部
                    requestAnimationFrame(() => { chatContainer.scrollTop = chatContainer.scrollHeight; });
                }
            } catch(streamErr) {
                // abort 或其他错误：确保已收集内容能返回
                if (streamErr.name !== 'AbortError') throw streamErr;
            }
            // 7.结束流，刷新剩余未闭合的 markdown 标记
            if (contentParser) window.smd.parser_end(contentParser);
            if (thoughtParser) window.smd.parser_end(thoughtParser);
            // 【流式渲染/系统】【思考清除】8. 结束流后，若从未输出过真实思考内容，则直接移去思考动效元素
            if (thoughtProcessEl) {
                if (!thoughtStarted) {
                    thoughtProcessEl.remove();
                } else {
                    thoughtProcessEl.classList.remove('thinking');
                }
            }
            // 9.流结束后最终代码高亮、数学公式与 Mermaid 渲染（含最后一个代码块）
            highlightCodeBlocks(el);
            renderMath(el);
            renderMermaid(el);
            if (thoughtEl) {
                highlightCodeBlocks(thoughtEl);
                renderMath(thoughtEl);
                renderMermaid(thoughtEl);
            }
            return { content: full, thought: thoughtFull, toolCalls: toolCalls.filter(Boolean) };
        }

        // ============================================================
        //  API 请求 & AI 响应处理
        // ============================================================
        // 全局中止控制器与响应状态
        let currentAbortController = null;
        let isResponding = false;

        // 发送按钮点击：响应中则中止，否则发送
        function onSendClick() {
            if (isResponding) {
                if (currentAbortController) currentAbortController.abort();
                return;
            }
            sendMessage();
        }

        // 设置发送按钮为响应中状态（显示停止图标）
        function setResponding(v) {
            isResponding = v;
            updateSendBtnState();
        }

        // 根据输入内容和响应状态更新发送按钮样式
        function updateSendBtnState() {
            const btn = document.getElementById('sendBtn');
            if (!btn) return;
            if (isResponding) {
                btn.classList.add('responding');
                btn.classList.remove('disabled');
                btn.disabled = false;
            } else {
                btn.classList.remove('responding');
                const hasContent = userInput.value.trim().length > 0 || pendingFiles.length > 0;
                if (hasContent) { btn.classList.remove('disabled'); btn.disabled = false; }
                else { btn.classList.add('disabled'); btn.disabled = true; }
            }
        }

        /**
         * 【网络搜索/TinyFish】【显示面板】展开或折叠网络搜索详情侧边栏并持久化状态
         * @param {boolean} show - 是否显示
         */
        function toggleSearchSidebar(show) {
            const sidebar = document.getElementById('searchSidebar');
            if (!sidebar) return;
            if (show) {
                sidebar.classList.remove('hidden');
                localStorage.setItem('searchSidebarExpanded', 'true');
            } else {
                sidebar.classList.add('hidden');
                localStorage.setItem('searchSidebarExpanded', 'false');
            }
            // 【网络搜索/TinyFish】【显示面板】更新输入框旁的详情面板按钮状态
            const toggleBtn = document.getElementById('searchPanelToggle');
            if (toggleBtn) {
                if (show) {
                    toggleBtn.classList.add('active');
                } else {
                    toggleBtn.classList.remove('active');
                }
            }
        }

        /**
         * 【网络搜索/TinyFish】【显示面板】手动点击输入框旁的详情面板按钮时的展开/隐藏响应
         * @returns {void}
         */
        function handleSearchPanelClick() {
            const sidebar = document.getElementById('searchSidebar');
            if (sidebar) {
                const isHidden = sidebar.classList.contains('hidden');
                toggleSearchSidebar(isHidden);
            }
        }

        /**
         * 【网络搜索/TinyFish】【清空面板】清空网络搜索侧边栏的内容
         */
        function clearSearchProcess() {
            const contentDiv = document.getElementById('searchSidebarContent');
            if (contentDiv) {
                contentDiv.innerHTML = '<div class="search-sidebar-empty">当前会话未触发网络搜索。</div>';
            }
        }

        /**
         * 【网络搜索/TinyFish】【渲染状态】向网络搜索侧边栏中追加详细流程卡片
         * @param {string} toolName - 工具名称
         * @param {string} title - 卡片标题
         * @param {string} detail - 详细说明文本
         * @param {Array} results - 搜索网页结果列表
         * @param {boolean} isError - 是否为错误状态
         * @param {Array} urlDetails - 抓取详情列表
         */
        /**
         * 【网络搜索/TinyFish】【渲染状态】向网络搜索侧边栏中追加详细流程卡片
         * @param {string} toolName - 工具名称
         * @param {string} title - 卡片标题
         * @param {string} detail - 详细说明文本
         * @param {Array} results - 搜索网页结果列表
         * @param {boolean} isError - 是否为错误状态
         * @param {Array} urlDetails - 抓取详情列表
         * @param {boolean} silent - 是否为静默模式，若为 true 则不自动展开侧边栏
         */
        function appendSearchProcessCard(toolName, title, detail, results = null, isError = false, urlDetails = null, silent = false) {
            // 【网络搜索/TinyFish】【渲染状态】如果不为静默模式，确保右侧栏展开
            if (!silent) {
                toggleSearchSidebar(true);
            }

            const contentDiv = document.getElementById('searchSidebarContent');
            if (!contentDiv) return;

            // 如果存在空提示，清除它
            const emptyEl = contentDiv.querySelector('.search-sidebar-empty');
            if (emptyEl) {
                contentDiv.innerHTML = '';
            }

            const card = document.createElement('div');
            card.className = 'search-step-card';
            if (isError) {
                card.style.borderColor = '#e06c75';
                card.style.background = 'rgba(224, 108, 117, 0.05)';
            }

            // 卡片头部
            let iconSvg = '';
            if (toolName === 'web_search') {
                iconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-main);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>`;
            } else {
                iconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-main);"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>`;
            }

            card.innerHTML = `
                <div class="search-step-title">
                    ${iconSvg}
                    <span>${escapeHtml(title)}</span>
                </div>
                <div class="search-step-detail">${escapeHtml(detail)}</div>
            `;

            // 如果有搜索结果列表
            if (results && results.length > 0) {
                const listDiv = document.createElement('div');
                listDiv.className = 'search-step-url-list';
                results.forEach((r, idx) => {
                    const item = document.createElement('div');
                    item.className = 'search-step-url-item';
                    item.innerHTML = `
                        <a href="${escapeHtml(r.url)}" target="_blank" class="search-step-url-link">${idx + 1}. [${escapeHtml(r.site_name || '链接')}] ${escapeHtml(r.title)}</a>
                        <span class="search-step-url-status">位置 ${r.position || idx + 1}</span>
                    `;
                    listDiv.appendChild(item);
                });
                card.appendChild(listDiv);
            }

            // 如果有抓取详情列表
            if (urlDetails && urlDetails.length > 0) {
                const listDiv = document.createElement('div');
                listDiv.className = 'search-step-url-list';
                urlDetails.forEach((ud, idx) => {
                    const item = document.createElement('div');
                    item.className = 'search-step-url-item';
                    const lenText = ud.length > 0 ? ` (${ud.length} 字符)` : '';
                    item.innerHTML = `
                        <a href="${escapeHtml(ud.url)}" target="_blank" class="search-step-url-link" style="max-width: 75%;">${idx + 1}. ${escapeHtml(ud.title || ud.url)}</a>
                        <span class="search-step-url-status" style="color: ${ud.status === '成功' ? '#98c379' : '#e06c75'}">${escapeHtml(ud.status)}${lenText}</span>
                    `;
                    listDiv.appendChild(item);
                });
                card.appendChild(listDiv);
            }

            contentDiv.appendChild(card);
            // 滚动到底部
            requestAnimationFrame(() => { contentDiv.scrollTop = contentDiv.scrollHeight; });
        }

        /**
         * 【网络搜索/TinyFish】【恢复历史】根据会话消息历史重新渲染右侧网络搜索侧边栏
         * @returns {void}
         */
        function restoreSearchProcess() {
            clearSearchProcess();
            const session = sessions.find(s => s.id === getCurrentId());
            if (!session || !session.messages || session.messages.length === 0) {
                toggleSearchSidebar(false);
                return;
            }

            // 【网络搜索/TinyFish】【恢复历史】1. 筛选出当前会话中所有的工具执行返回消息
            const toolMsgs = session.messages.filter(m => m.role === 'tool');
            if (toolMsgs.length === 0) {
                toggleSearchSidebar(false);
                return;
            }

            let hasValidSearch = false;
            
            toolMsgs.forEach(toolMsg => {
                // 【网络搜索/TinyFish】【恢复历史】2. 寻找前置 assistant 消息中的工具调用定义以提取调用参数
                const relatedAssistant = session.messages.find(m => 
                    m.role === 'assistant' && 
                    m.tool_calls && 
                    m.tool_calls.some(tc => tc.id === toolMsg.tool_call_id)
                );
                if (!relatedAssistant) return;
                
                const toolCall = relatedAssistant.tool_calls.find(tc => tc.id === toolMsg.tool_call_id);
                if (!toolCall) return;

                let args = {};
                try {
                    args = typeof toolCall.function.arguments === 'string' 
                        ? JSON.parse(toolCall.function.arguments) 
                        : toolCall.function.arguments;
                } catch(e) {}

                let results = null;
                try {
                    results = JSON.parse(toolMsg.content);
                } catch(e) {}

                // 【网络搜索/TinyFish】【恢复历史】3. 根据工具名称静默向侧边栏追加对应的卡片
                if (toolMsg.name === 'web_search') {
                    const query = args.query || '';
                    const detailText = results && results.length > 0 
                        ? `检索到 ${results.length} 条网页记录：` 
                        : '未找到相关结果';
                    appendSearchProcessCard('web_search', `执行搜索: "${query}"`, detailText, results, false, null, true);
                    hasValidSearch = true;
                } else if (toolMsg.name === 'fetch_webpage') {
                    const urls = args.urls || [args.url].filter(Boolean) || [];
                    const pages = Array.isArray(results) ? results : [];
                    const processedPages = urls.map(u => {
                        const p = pages.find(page => page.url === u || page.final_url === u);
                        return {
                            url: u,
                            title: p ? p.title : '未知标题',
                            status: p && p.text ? '成功' : '失败',
                            length: p && p.text ? p.text.length : 0
                        };
                    });
                    appendSearchProcessCard('fetch_webpage', '提取网页正文', '成功抓取到网页正文：', null, false, processedPages, true);
                    hasValidSearch = true;
                }
            });

            // 【网络搜索/TinyFish】【恢复历史】4. 如果重建出了合法的搜索流程卡片，则显示按钮并根据持久化偏好展开/折叠侧边栏
            const toggleBtn = document.getElementById('searchPanelToggle');
            if (hasValidSearch) {
                if (toggleBtn) toggleBtn.style.display = 'inline-flex';
                const isExpanded = localStorage.getItem('searchSidebarExpanded') !== 'false';
                toggleSearchSidebar(isExpanded);
            } else {
                if (toggleBtn) toggleBtn.style.display = 'none';
                toggleSearchSidebar(false);
            }
        }

        /**
         * 【网络搜索/TinyFish】【执行搜索】通过 TinyFish 接口检索网络内容并返回链接和摘要
         * @param {string} query - 搜索关键词
         * @returns {Promise<Array>} - 搜索结果列表
         */
        async function performWebSearchOnly(query) {
            const s = webSearchSettings;
            if (!s.apiKey) {
                throw new Error('未配置 TinyFish API Key');
            }
            
            // 【网络搜索/TinyFish】【执行搜索】1. 更新右侧面板状态
            appendSearchProcessCard('web_search', `执行搜索: "${query}"`, '正在发起搜索请求...');

            const searchUrl = `${s.apiUrl.replace(/\/+$/, '')}/v1/search?query=${encodeURIComponent(query)}&location=${encodeURIComponent(s.location)}&language=${encodeURIComponent(s.language)}`;
            const searchRes = await fetch(searchUrl, {
                headers: {
                    'X-API-Key': s.apiKey,
                    'Content-Type': 'application/json'
                }
            });
            
            if (!searchRes.ok) {
                const errMsg = `搜索失败 (HTTP ${searchRes.status})`;
                appendSearchProcessCard('web_search', `执行搜索: "${query}"`, errMsg, null, true);
                throw new Error(errMsg);
            }
            
            const searchData = await searchRes.json();
            const results = searchData.results || [];
            
            // 【网络搜索/TinyFish】【执行搜索】2. 渲染结果列表
            const detailText = results.length > 0 
                ? `检索到 ${results.length} 条网页记录：` 
                : '未找到相关结果';
            appendSearchProcessCard('web_search', `执行搜索: "${query}"`, detailText, results);
            
            return results;
        }

        /**
         * 【网络搜索/TinyFish】【执行抓取】通过 TinyFish 接口抓取指定网页列表的正文
         * @param {Array<string>} urls - 网页链接列表
         * @returns {Promise<Array>} - 抓取的正文数据列表
         */
        async function performWebpageFetchOnly(urls) {
            const s = webSearchSettings;
            if (!s.apiKey) {
                throw new Error('未配置 TinyFish API Key');
            }
            
            // 【网络搜索/TinyFish】【执行抓取】1. 更新右侧面板状态
            appendSearchProcessCard('fetch_webpage', '提取网页正文', `正在发起内容提取请求...`);

            let pages = [];
            try {
                const fetchRes = await fetch(`${s.apiUrl.replace(/\/+$/, '')}/v1/fetch`, {
                    method: 'POST',
                    headers: {
                        'X-API-Key': s.apiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        urls: urls,
                        format: 'markdown'
                    })
                });
                if (fetchRes.ok) {
                    const fetchData = await fetchRes.json();
                    pages = fetchData.results || [];
                } else {
                    throw new Error(`提取失败 (HTTP ${fetchRes.status})`);
                }
            } catch(e) {
                console.error('【网络搜索/TinyFish】【网页抓取】内容抓取失败: ', e);
                appendSearchProcessCard('fetch_webpage', '提取网页正文', `抓取过程中出现异常: ${e.message}`, null, true);
                throw e;
            }

            // 【网络搜索/TinyFish】【执行抓取】2. 渲染抓取结果
            const processedPages = urls.map(u => {
                const p = pages.find(page => page.url === u || page.final_url === u);
                return {
                    url: u,
                    title: p ? p.title : '未知标题',
                    status: p && p.text ? '成功' : '失败',
                    length: p && p.text ? p.text.length : 0
                };
            });

            appendSearchProcessCard('fetch_webpage', '提取网页正文', '成功抓取到网页正文：', null, false, processedPages);
            return pages;
        }

        /**
         * 【AI响应/系统】【对话生成】向模型发起对话请求并流式/非流式获取回复，支持智能代理网络搜索工具的自主调用
         * @returns {Promise<void>}
         */
        async function fetchAIResponse() {
            const provider = getActiveProvider();
            if (!provider) { setResponding(false); return; }

            const currentSession = sessions.find(s => s.id === getCurrentId());

            const preset = getActivePreset();
            // 【AI响应/系统】【对话生成】fakeThought 为特殊标记，appendMessageDOM 检测后显示思考中动效
            const fakeThought = '__thinking__';
            const msgIdx = currentSession.messages.length;
            const aiMessageElement = appendMessageDOM('assistant', '', fakeThought, null, null, msgIdx);

            let finalReplyText = '';
            let finalThoughtText = '';

            try {
                currentAbortController = new AbortController();
                setResponding(true);

                // 【AI响应/系统】【对话生成】初始化消息历史与工具列表
                let messages = [...currentSession.messages];
                if (preset && preset.systemPrompt) {
                    messages = [{ role: 'system', content: preset.systemPrompt }, ...messages];
                }

                const useStream = preset ? preset.stream : false;
                let loopCount = 0;
                const maxLoops = 5;

                // 【AI响应/系统】【工具定义】声明供 AI 自主调用的 TinyFish 搜索与抓取工具
                const searchTools = [
                    {
                        type: "function",
                        function: {
                            name: "web_search",
                            description: "【网络搜索/TinyFish】搜索互联网以获取网页的最新链接和摘要，包含标题、网址、位置等信息",
                            parameters: {
                                type: "object",
                                properties: {
                                    query: {
                                        type: "string",
                                        description: "搜索查询关键词"
                                    }
                                },
                                required: ["query"]
                            }
                        }
                    },
                    {
                        type: "function",
                        function: {
                            name: "fetch_webpage",
                            description: "【网络搜索/TinyFish】从给定的 URL 列表中提取并返回 Markdown 格式的网页正文内容，便于细致阅读与分析",
                            parameters: {
                                type: "object",
                                properties: {
                                    urls: {
                                        type: "array",
                                        items: {
                                            type: "string"
                                        },
                                        description: "要抓取的网页链接 URL 数组列表"
                                    }
                                },
                                required: ["urls"]
                            }
                        }
                    }
                ];

                while (loopCount < maxLoops) {
                    const body = {
                        model: activeModel,
                        messages: messages,
                        stream: useStream,
                        temperature: preset ? preset.temperature : 0.7,
                        top_p: preset ? preset.top_p : 1,
                        frequency_penalty: preset ? preset.frequency_penalty : 0,
                        presence_penalty: preset ? preset.presence_penalty : 0
                    };
                    if (thinkingLevel && thinkingLevel !== 'auto') body.thinking = thinkingLevel;
                    if (webSearchSettings.enabled) {
                        body.tools = searchTools;
                    }

                    // 【AI响应/系统】【请求模型】发起大模型聊天对话接口请求
                    const response = await fetch(normalizeApiUrl(provider.apiUrl), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${provider.apiKey}` },
                        body: JSON.stringify(body),
                        signal: currentAbortController?.signal
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        let errMsg = `HTTP 状态码 ${response.status}`;
                        try { errMsg = JSON.parse(errText).error?.message || errMsg; } catch(e) {}
                        throw new Error(errMsg);
                    }

                    let aiReply = '', realThought = null, toolCalls = [];
                    if (useStream && response.body) {
                        // 【AI响应/系统】【读取响应】流式读取 SSE 响应数据并提取 tool_calls 列表
                        const r = await readSSEStream(response.body, aiMessageElement);
                        aiReply = r.content;
                        realThought = r.thought || null;
                        toolCalls = r.toolCalls || [];
                    } else {
                        // 【AI响应/系统】【读取响应】非流式直接读取响应体并提取 tool_calls 列表
                        const data = await response.json();
                        aiReply = data.choices[0].message.content || '';
                        realThought = data.choices[0].message.reasoning_content || null;
                        toolCalls = data.choices[0].message.tool_calls || [];
                    }

                    // 【AI响应/系统】【工具决策】判断 AI 是否决策并生成了工具调用请求
                    if (toolCalls && toolCalls.length > 0) {
                        // 【AI响应/系统】【工具执行】大模型决策发起工具调用，将 assistant 消息与调用信息追加至会话历史中
                        const assistantMsg = {
                            role: "assistant",
                            content: aiReply || null,
                            tool_calls: toolCalls,
                            model: activeModel,
                            presetId: activePresetId
                        };
                        messages.push(assistantMsg);
                        currentSession.messages.push(assistantMsg);

                        // 【AI响应/系统】【工具执行】遍历并并发或依次执行所有发起的工具调用
                        for (const tool of toolCalls) {
                            let resultStr = '';
                            try {
                                let args = tool.function.arguments;
                                if (typeof args === 'string') {
                                    args = JSON.parse(args);
                                }
                                if (tool.function.name === 'web_search') {
                                    const query = args.query;
                                    const results = await performWebSearchOnly(query);
                                    resultStr = JSON.stringify(results);
                                } else if (tool.function.name === 'fetch_webpage') {
                                    const urls = args.urls || [args.url].filter(Boolean);
                                    const pages = await performWebpageFetchOnly(urls);
                                    resultStr = JSON.stringify(pages);
                                } else {
                                    resultStr = "未知的工具名称";
                                }
                            } catch (err) {
                                resultStr = `工具执行失败: ${err.message}`;
                            }

                            // 【AI响应/系统】【工具执行】将工具调用的执行返回结果追加至会话历史中
                            const toolMsg = {
                                role: "tool",
                                tool_call_id: tool.id,
                                name: tool.function.name,
                                content: resultStr
                            };
                            messages.push(toolMsg);
                            currentSession.messages.push(toolMsg);
                        }

                        saveSessionsToStorage();
                        loopCount++;
                        
                        // 【AI响应/系统】【工具执行】更新聊天气泡中的过渡状态文字
                        aiMessageElement.innerHTML = `<span style="color:var(--text-muted);font-size:13px;display:flex;align-items:center;gap:6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg> 搜索完毕，正在解析数据并生成回答...</span>`;
                        continue;
                    }

                    // 【AI响应/系统】【对话生成】大模型未决策工具调用，代表生成最终回答，跳出循环
                    finalReplyText = aiReply;
                    finalThoughtText = realThought || '';
                    break;
                }

                // 【AI响应/系统】【保存消息】将大模型最终文本输出追加至消息列表中并保存
                currentSession.messages.push({
                    role: "assistant",
                    content: finalReplyText,
                    thought: finalThoughtText,
                    model: activeModel,
                    presetId: activePresetId
                });

                if (pendingVersions !== null) {
                    currentSession.messages[currentSession.messages.length - 1].versions = pendingVersions;
                    pendingVersions = null;
                }

                saveSessionsToStorage();
                renderChatArea();

            } catch (error) {
                // 【AI响应/系统】【对话生成】捕获生成异常并做出容错处理
                if (error.name === 'AbortError') {
                    if (finalReplyText || finalThoughtText) {
                        currentSession.messages.push({ role: "assistant", content: finalReplyText || '(已中止)', thought: finalThoughtText || '', model: activeModel, presetId: activePresetId });
                        pendingVersions = null;
                        saveSessionsToStorage();
                    }
                    renderChatArea();
                    return;
                }
                const msg = error.message || '';
                if (msg.toLowerCase().includes('image') || msg.includes('图片')) {
                    // 【AI响应/系统】【对话生成】容错处理：当模型不支持图片时，过滤图片字段后重试
                    let filtered = false;
                    currentSession.messages.forEach(m => {
                        if (m.role === 'user' && Array.isArray(m.content)) {
                            const textOnly = m.content.filter(c => c.type === 'text');
                            if (textOnly.length === 1) m.content = textOnly[0].text;
                            else if (textOnly.length === 0) m.content = '';
                            else m.content = textOnly;
                            filtered = true;
                        }
                    });
                    if (filtered) {
                        saveSessionsToStorage();
                        const tipMsg = '提示：该模型不支持图片输入，已自动转为纯文字发送';
                        currentSession.messages.push({ role: "assistant", content: tipMsg, presetId: activePresetId });
                        saveSessionsToStorage();
                        renderChatArea();
                        setTimeout(() => fetchAIResponse(), 100);
                    } else {
                        const errMsg = '该模型不支持图片输入，请移除图片或切换到支持多模态的模型后重试。';
                        currentSession.messages.push({ role: "assistant", content: errMsg, presetId: activePresetId });
                        pendingVersions = null;
                        saveSessionsToStorage();
                        renderChatArea();
                    }
                } else {
                    const errFull = `请求失败: ${msg}`;
                    currentSession.messages.push({ role: "assistant", content: errFull, presetId: activePresetId });
                    pendingVersions = null;
                    saveSessionsToStorage();
                    renderChatArea();
                }
            } finally {
                currentAbortController = null;
                setResponding(false);
                // 【AI响应/系统】【对话生成】滚动容器到聊天底部
                requestAnimationFrame(() => { chatContainer.scrollTop = chatContainer.scrollHeight; });
            }
        }

        // ============================================================
        //  发送消息
        // ============================================================
        function sendMessage() {
            if (favMode) return; // 收藏模式不发送消息
            const text = userInput.value.trim();

            // 生图模式
            if (imageGenMode) {
                if (!text) return;
                sendImageGeneration(text);
                return;
            }

            const hasImage = pendingFiles.length > 0;
            if (!text && !hasImage) return;

            // 【网络搜索/TinyFish】【重置面板】在发送新消息前重置并隐藏右侧侧边栏展示状态
            clearSearchProcess();
            toggleSearchSidebar(false);

            const provider = getActiveProvider();
            if (!provider || !provider.apiUrl || !provider.apiKey || !activeModel) {
                showToast('请配置 API 参数！');
                openSettings();
                return;
            }

            const currentSession = sessions.find(s => s.id === getCurrentId());
            currentSession.type = 'chat'; // 确保类型正确
            if (currentSession.messages.length === 0) {
                currentSession.title = text.length > 12 ? text.substring(0, 12) + '...' : text || '图片消息';
                renderSidebar();
            }

            let content, displayText, imageForDisplay = null;
            if (hasImage) {
                // 1.构建 OpenAI 多图格式：文本 + 多个 image_url
                const imageContents = pendingFiles.map(f => ({ type: 'image_url', image_url: { url: f.base64 } }));
                content = text ? [{ type: 'text', text: text }, ...imageContents] : imageContents;
                displayText = text || '图片';
                // 2.展示用第一张图缩略图（多图在 appendMessageDOM 中循环渲染）
                imageForDisplay = pendingFiles.map(f => f.base64);
            } else {
                content = text;
                displayText = text;
            }

            appendMessageDOM('user', displayText, null, imageForDisplay, null, currentSession.messages.length);
            currentSession.messages.push({ role: "user", content: content });
            saveSessionsToStorage();
            
            clearImagePreview();
            userInput.value = '';
            userInput.style.height = '24px';
            
            fetchAIResponse();
        }

        // ============================================================
        //  图片生成
        // ============================================================
        async function sendImageGeneration(prompt, skipUserMsg = false) {
            saveGenSettings(); // 每次生图前保存设置
            const provider = getActiveProvider();
            if (!provider || !provider.apiUrl || !provider.apiKey || !activeModel) {
                showToast('请配置 API 参数！');
                openSettings();
                return;
            }

            const currentSession = sessions.find(s => s.id === getCurrentId());
            currentSession.type = 'gen'; // 确保类型正确
            if (!skipUserMsg && currentSession.messages.length === 0) {
                currentSession.title = prompt.length > 12 ? prompt.substring(0, 12) + '...' : prompt || '生图';
                renderSidebar();
            }

            if (!skipUserMsg) {
                // 显示用户消息
                appendMessageDOM('user', prompt, null, null, null, currentSession.messages.length);
                currentSession.messages.push({ role: "user", content: prompt });
                saveSessionsToStorage();
            }

            userInput.value = '';
            userInput.style.height = '24px';

            const msgIdx = currentSession.messages.length;
            const aiMsgEl = appendMessageDOM('assistant', '正在生成图片...', null, null, null, msgIdx);

            try {
                currentAbortController = new AbortController();
                setResponding(true);
                let baseUrl = (provider.apiUrl || '').trim().replace(/\/+$/, '');
                if (baseUrl.endsWith('/chat/completions')) {
                    baseUrl = baseUrl.slice(0, -'/chat/completions'.length);
                }
                const genUrl = baseUrl + '/images/generations';

                const seedVal = parseInt(document.getElementById('genSeed').value) || 0;
                const body = {
                    model: activeModel,
                    prompt: prompt,
                    num_images_per_prompt: 1,
                    negative_prompt: document.getElementById('genNegativePrompt').value.trim() || undefined,
                    num_inference_steps: parseInt(document.getElementById('genSteps').value) || 9,
                    guidance_scale: parseFloat(document.getElementById('genGuidanceScale').value) || 1,
                    image_scale: parseFloat(document.getElementById('genImageScale').value) || 1,
                    size: getGenSize(),
                };
                if (seedVal !== 0) body.seed = seedVal; // 0=随机，不传

                // 控制模式
                const controlMode = document.getElementById('genControlMode').value;
                if (controlMode) {
                    body.control_mode = controlMode;
                    body.control_context_scale = parseFloat(document.getElementById('genControlScale').value) || 0.75;
                    if (genControlImage) {
                        body.control_image = genControlImage.base64;
                    }
                }

                const response = await fetch(genUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${provider.apiKey}` },
                    body: JSON.stringify(body),
                    signal: currentAbortController?.signal
                });

                if (!response.ok) {
                    const errText = await response.text();
                    let errMsg = `HTTP ${response.status}`;
                    try { errMsg = JSON.parse(errText).error?.message || errMsg; } catch(e) {}
                    throw new Error(errMsg);
                }

                const data = await response.json();

                // 处理生成结果
                const genImages = [];       // 持久化：{b64, type}
                let resultHtml = '';        // 持久化用的 HTML（占位符）
                if (data.data && data.data.length > 0) {
                    for (let i = 0; i < data.data.length; i++) {
                        const imgData = data.data[i];
                        if (imgData.url) {
                            const url = imgData.url;
                            resultHtml += `<div style="position:relative;display:inline-block;margin:4px;">
                                <img src="${escapeHtml(url)}" onclick="previewGenImage('${escapeHtml(url)}')" 
                                    style="max-width:280px;max-height:280px;border-radius:12px;cursor:pointer;border:1px solid var(--border-color);"
                                    onerror="this.style.display='none';">
                            </div>`;
                        } else if (imgData.b64_json) {
                            const idx = genImages.length;
                            genImages.push({ b64: imgData.b64_json, type: imgData.type || 'image/png' });
                            resultHtml += `<div style="position:relative;display:inline-block;margin:4px;">
                                <img src="" data-gen-idx="${idx}" data-gen-src="" onclick="previewGenImage(this.src)" 
                                    style="max-width:280px;max-height:280px;border-radius:12px;cursor:pointer;border:1px solid var(--border-color);">
                            </div>`;
                        }
                    }
                    if (resultHtml) {
                        resultHtml = '<div class="generated-images">' + resultHtml + '</div>';
                    } else {
                        resultHtml = '已生成但无法显示图片';
                    }
                } else {
                    resultHtml = '未能生成图片，请检查参数后重试';
                }

                // 持久化（使用占位符版本，images 数组单独存储）
                const genParams = {
                    size: getGenSize(),
                    steps: parseInt(document.getElementById('genSteps').value) || 9,
                    guidance: parseFloat(document.getElementById('genGuidanceScale').value) || 1,
                    imgScale: parseFloat(document.getElementById('genImageScale').value) || 1,
                    seed: seedVal,
                    negative: document.getElementById('genNegativePrompt').value.trim() || '',
                    control: document.getElementById('genControlMode').value || '',
                    controlScale: document.getElementById('genControlScale').value || ''
                };
                const msgData = {
                    role: "assistant",
                    content: resultHtml,
                    model: activeModel,
                    genPrompt: prompt,
                    genParams: genParams,
                    isHtml: true
                };
                if (genImages.length > 0) msgData.images = genImages;
                currentSession.messages.push(msgData);
                if (pendingVersions !== null) {
                    currentSession.messages[currentSession.messages.length - 1].versions = pendingVersions;
                    pendingVersions = null;
                }
                saveSessionsToStorage();
                renderChatArea(); // 用 renderChatArea 重建，正确显示版本导航 ◂ ▸

                // 清理控制图片
                clearGenControlImage();

            } catch (error) {
                if (error.name === 'AbortError') return;
                const errFull = `生图失败: ${error.message || '未知错误'}`;
                aiMsgEl.textContent = errFull;
                currentSession.messages.push({ role: "assistant", content: errFull });
                saveSessionsToStorage();
                renderChatArea();
            } finally {
                currentAbortController = null;
                setResponding(false);
                requestAnimationFrame(() => { chatContainer.scrollTop = chatContainer.scrollHeight; });
            }
        }

        function previewGenImage(src) {
            document.getElementById('imgLightboxImg').src = src;
            document.getElementById('imgLightbox').classList.add('show');
        }

        function closeImgLightbox() {
            document.getElementById('imgLightbox').classList.remove('show');
            document.getElementById('imgLightboxImg').src = '';
        }

        function downloadGenImageFromSrc(src) {
            const a = document.createElement('a');
            a.href = src;
            a.download = 'generated-image.png';
            a.click();
        }

        function downloadGenImage(b64Data, index) {
            const a = document.createElement('a');
            a.href = 'data:image/png;base64,' + b64Data;
            a.download = `generated-image-${index}.png`;
            a.click();
        }

        // 下载消息块中的所有生成图片
        function downloadGenBlockImages(btnEl) {
            const block = btnEl.closest('.message-block');
            const imgs = block.querySelectorAll('.generated-images img, .message-content img');
            if (imgs.length === 0) { showToast('没有可下载的图片'); return; }
            imgs.forEach((img, i) => {
                setTimeout(() => {
                    const src = img.getAttribute('data-gen-src') || img.src;
                    if (src) downloadGenImageFromSrc(src);
                }, i * 200);
            });
            showToast(`正在下载 ${imgs.length} 张图片`);
        }

        // 收藏消息块中的生成图片
        function favGenBlockImages(btnEl) {
            const block = btnEl.closest('.message-block');
            const contentEl = block.querySelector('.message-content');
            const msgIdx = parseInt(contentEl.getAttribute('data-index'));
            if (isNaN(msgIdx)) return;
            const session = sessions.find(s => s.id === getCurrentId());
            if (!session) return;
            const msg = session.messages[msgIdx];
            if (!msg) return;
            const prompt = msg.genPrompt || '';
            const genModel = msg.model || activeModel;
            const imgs = block.querySelectorAll('.generated-images img, .message-content img');
            let count = 0;
            imgs.forEach(img => {
                let src = img.getAttribute('data-gen-src') || img.src;
                if (!src || src === 'null' || src === 'undefined') return;
                // 对于占位符，从 session 消息的 images 数组中还原
                const dataIdx = parseInt(img.getAttribute('data-gen-idx'));
                if (!isNaN(dataIdx) && msg.images && msg.images[dataIdx]) {
                    const gi = msg.images[dataIdx];
                    src = 'data:' + (gi.type || 'image/png') + ';base64,' + gi.b64;
                }
                addFavorite(src, prompt, 'gen', genModel);
                count++;
            });
            if (count > 0) {
                btnEl.style.fill = '#e74c3c';
                btnEl.removeAttribute('stroke');
                btnEl.style.stroke = 'none';
                btnEl.style.color = '#e74c3c';
            }
        }

        // 检查生成消息是否已收藏（通过 prompt 匹配）
        function isGenMsgFavorited(msg) {
            if (!msg || !msg.genPrompt) return false;
            const prompt = msg.genPrompt;
            // 如果有 images 数组（base64），逐一比对
            if (msg.images && msg.images.length > 0) {
                return msg.images.some(gi => {
                    const src = 'data:' + (gi.type || 'image/png') + ';base64,' + gi.b64;
                    return favorites.some(f => f.imageSrc === src && f.prompt === prompt);
                });
            }
            // URL 类型：从 HTML 中提取图片 URL 后比对
            const html = typeof msg.content === 'string' ? msg.content : '';
            const urlMatches = html.match(/src="([^"]+)"/g);
            if (urlMatches) {
                return urlMatches.some(m => {
                    const src = m.replace(/^src="/, '').replace(/"$/, '');
                    return favorites.some(f => f.imageSrc === src && f.prompt === prompt);
                });
            }
            // 兜底：仅按 prompt 匹配
            return favorites.some(f => f.prompt === prompt);
        }

        // ============================================================
        //  暗色模式
        // ============================================================
        const sunIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
        const moonIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';

        function toggleDarkMode() {
            const html = document.documentElement;
            const btn = document.querySelector('.dark-mode-btn');
            
            const currentTheme = html.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                html.removeAttribute('data-theme');
                btn.innerHTML = moonIcon;
                btn.title = '切换深色模式';
                localStorage.setItem('theme', 'light');
                // 切换代码高亮主题为亮色
                document.getElementById('hljsLightTheme').disabled = false;
                document.getElementById('hljsDarkTheme').disabled = true;
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.innerHTML = sunIcon;
                btn.title = '切换浅色模式';
                localStorage.setItem('theme', 'dark');
                // 切换代码高亮主题为暗色
                document.getElementById('hljsLightTheme').disabled = true;
                document.getElementById('hljsDarkTheme').disabled = false;
            }
            // 重新初始化并应用 Mermaid 主题，然后刷新聊天区域
            if (window.mermaid) {
                const isDark = html.getAttribute('data-theme') === 'dark';
                mermaid.initialize({
                    startOnLoad: false,
                    theme: isDark ? 'dark' : 'default',
                    securityLevel: 'loose'
                });
            }
            renderChatArea();
        }

        // 初始化主题
        (function initTheme() {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                const btn = document.querySelector('.dark-mode-btn');
                btn.innerHTML = sunIcon;
                btn.title = '切换浅色模式';
                document.getElementById('hljsLightTheme').disabled = true;
                document.getElementById('hljsDarkTheme').disabled = false;
            } else {
                document.getElementById('hljsLightTheme').disabled = false;
                document.getElementById('hljsDarkTheme').disabled = true;
            }
        })();
    </script>
    <div class="img-lightbox" id="imgLightbox" onclick="closeImgLightbox()">
        <span class="img-lightbox-close" onclick="event.stopPropagation();closeImgLightbox()">✕</span>
        <img id="imgLightboxImg" src="">
    </div>
