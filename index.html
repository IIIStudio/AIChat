        async function savePresets() {
            try { await dbSet('presets', { presets: paramPresets, activePresetId }); } catch(e) {}
        }

        function getActivePreset() {
            return paramPresets.find(p => p.id === activePresetId) || null;
        }

        // ============================================================
        //  参数预设 — UI 渲染 & 交互
        // ============================================================
        function renderPresetTags() {
            if (imageGenMode || favMode) return; // 生图/收藏模式不显示预设
            const row = document.getElementById('presetTagsRow');
            if (!row) return;
            row.innerHTML = '';
            paramPresets.forEach(p => {
                const tag = document.createElement('span');
                tag.className = 'preset-tag' + (p.id === activePresetId ? ' active' : '');
                tag.textContent = p.name;
                tag.addEventListener('click', () => selectPreset(p.id));
                tag.addEventListener('contextmenu', (e) => { e.preventDefault(); openPresetEdit(p.id); });
                row.appendChild(tag);
            });
            const addTag = document.createElement('span');
            addTag.className = 'preset-tag';
            addTag.textContent = '+ 添加';
            addTag.style.cssText = 'border-style:dashed;';
            addTag.addEventListener('click', () => openPresetEdit(null));
            row.appendChild(addTag);
        }

        function selectPreset(id) {
            if (imageGenMode || favMode) return; // 生图/收藏模式不操作预设
            activePresetId = id;
            const sess = sessions.find(s => s.id === getCurrentId());
            if (sess) sess.presetId = id;
            savePresets();
            saveSessionsToStorage();
            renderPresetTags();
            const p = getActivePreset();
            if (p) showToast(`已选择预设: ${p.name}`);
        }

        function selectStream(v) {
            document.getElementById('presetEditStream').value = v ? 'true' : 'false';
            document.getElementById('streamYes').classList.toggle('active', v);
            document.getElementById('streamNo').classList.toggle('active', !v);
        }

        // ============================================================
        //  参数预设 — 编辑器弹窗
        // ============================================================
        function openPresetEdit(id) {
            editingPresetId = id;
            const p = id ? paramPresets.find(p => p.id === id) : null;
            document.getElementById('presetEditTitle').textContent = id ? '编辑参数预设' : '新建参数预设';
            document.getElementById('presetEditName').value = p ? p.name : '';
            document.getElementById('presetEditSysPrompt').value = p ? (p.systemPrompt || '') : '';
            const t = p ? p.temperature : 0.7;
            document.getElementById('presetEditTemp').value = t;
            document.getElementById('tempVal').textContent = t;
            const tp = p ? p.top_p : 1;
            document.getElementById('presetEditTopP').value = tp;
            document.getElementById('topPVal').textContent = tp;
            const fp = p ? p.frequency_penalty : 0;
            document.getElementById('presetEditFp').value = fp;
            document.getElementById('fpVal').textContent = fp;
            const pp = p ? p.presence_penalty : 0;
            document.getElementById('presetEditPp').value = pp;
            document.getElementById('ppVal').textContent = pp;
            const stream = p ? p.stream : false;
            selectStream(stream);
            document.getElementById('presetDeleteBtn').style.display = id ? '' : 'none';
            document.getElementById('presetEditModal').style.display = 'flex';
        }

        function closePresetEdit() {
            document.getElementById('presetEditModal').style.display = 'none';
            editingPresetId = null;
        }

        function savePreset() {
            const name = document.getElementById('presetEditName').value.trim() || '未命名';
            const systemPrompt = document.getElementById('presetEditSysPrompt').value.trim();
            const temperature = parseFloat(document.getElementById('presetEditTemp').value) || 0.7;
            const top_p = parseFloat(document.getElementById('presetEditTopP').value) || 1;
            const frequency_penalty = parseFloat(document.getElementById('presetEditFp').value) || 0;
            const presence_penalty = parseFloat(document.getElementById('presetEditPp').value) || 0;
            const stream = document.getElementById('presetEditStream').value === 'true';

            if (editingPresetId) {
                const p = paramPresets.find(p => p.id === editingPresetId);
                if (p) Object.assign(p, { name, systemPrompt, temperature, top_p, frequency_penalty, presence_penalty, stream });
            } else {
                const newId = (paramPresets.length > 0 ? Math.max(...paramPresets.map(p => p.id)) : 0) + 1;
                paramPresets.push({ id: newId, name, systemPrompt, temperature, top_p, frequency_penalty, presence_penalty, stream });
                if (!activePresetId) activePresetId = newId;
            }
            savePresets();
            renderPresetTags();
            closePresetEdit();
            showToast('预设已保存');
        }

        function deletePreset() {
            if (!editingPresetId || paramPresets.length <= 1) { showToast('至少保留一个预设'); return; }
            paramPresets = paramPresets.filter(p => p.id !== editingPresetId);
            if (activePresetId === editingPresetId) activePresetId = paramPresets[0]?.id || null;
            savePresets();
            renderPresetTags();
            closePresetEdit();
            showToast('预设已删除');
        }

        // ============================================================
        //  预设标签行拖拽滚动
        // ============================================================
        function initPresetDrag() {
            const row = document.getElementById('presetTagsRow');
            if (!row) return;
            let isDown = false, startX, scrollLeft;
            row.addEventListener('mousedown', (e) => {
                if (e.target.closest('.preset-tag')) return;
                isDown = true; row.classList.add('dragging');
                startX = e.pageX - row.offsetLeft; scrollLeft = row.scrollLeft;
            });
            row.addEventListener('mouseleave', () => { isDown = false; row.classList.remove('dragging'); });
            row.addEventListener('mouseup', () => { isDown = false; row.classList.remove('dragging'); });
            row.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - row.offsetLeft;
                row.scrollLeft = scrollLeft - (x - startX) * 1.5;
            });
        }
        window.addEventListener('DOMContentLoaded', initPresetDrag);

        // ============================================================
        //  会话重命名
        // ============================================================
        let renamingSessionId = null;
        function openRenameModal(id, currentTitle, event) {
            event.stopPropagation();
            renamingSessionId = id;
            document.getElementById('renameInput').value = currentTitle;
            document.getElementById('renameModal').style.display = 'flex';
        }
        function closeRenameModal() { document.getElementById('renameModal').style.display = 'none'; }
        function saveRename() {
            const newTitle = document.getElementById('renameInput').value.trim();
            if (newTitle && renamingSessionId !== null) {
                const session = sessions.find(s => s.id === renamingSessionId);
                if (session) { session.title = newTitle; renderSidebar(); saveSessionsToStorage(); showToast('已重命名'); }
            }
            closeRenameModal();
        }

        // ============================================================
        //  搜索会话
        // ============================================================
        function openSearchModal() {
            document.getElementById('searchModal').style.display = 'flex';
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').innerHTML = '<div style="color:var(--text-muted);padding:20px 0;font-size:13px;text-align:center;">输入关键词搜索会话</div>';
            document.getElementById('searchClearBtn').style.display = 'none';
            document.getElementById('searchStats').style.display = 'none';
            setTimeout(() => document.getElementById('searchInput').focus(), 100);
        }

        function closeSearchModal() {
            document.getElementById('searchModal').style.display = 'none';
        }

        // Escape 键关闭搜索弹窗
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && document.getElementById('searchModal').style.display === 'flex') {
                closeSearchModal();
            }
        });

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            input.focus();
            performSearch();
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('searchResults');
            const clearBtn = document.getElementById('searchClearBtn');
            const statsDiv = document.getElementById('searchStats');

            clearBtn.style.display = query ? 'block' : 'none';

            if (!query) {
                resultsDiv.innerHTML = '<div style="color:var(--text-muted);padding:20px 0;font-size:13px;text-align:center;">输入关键词搜索会话</div>';
                statsDiv.style.display = 'none';
                return;
            }

            const results = [];
            sessions.forEach(session => {
                const titleMatch = (session.title || '').toLowerCase().includes(query);
                if (titleMatch) {
                    results.push({ sessionId: session.id, title: session.title, isTitleMatch: true });
                }
                session.messages.forEach(msg => {
                    let text = '';
                    if (Array.isArray(msg.content)) {
                        text = msg.content.filter(c => c.type === 'text').map(c => c.text).join(' ');
                    } else if (typeof msg.content === 'string') {
                        text = msg.content;
                    }
                    const idx = text.toLowerCase().indexOf(query);
                    if (idx !== -1) {
                        const existing = results.find(r => r.sessionId === session.id && !r.isTitleMatch);
                        if (!existing) {
                            const titleIdx = results.findIndex(r => r.sessionId === session.id && r.isTitleMatch);
                            if (titleIdx !== -1) results.splice(titleIdx, 1);
                            const start = Math.max(0, idx - 40);
                            const end = Math.min(text.length, idx + query.length + 50);
                            let preview = (start > 0 ? '…' : '') + text.substring(start, end) + (end < text.length ? '…' : '');
                            results.push({ sessionId: session.id, title: session.title, preview, isTitleMatch: false, role: msg.role });
                        }
                    }
                });
            });

            if (results.length === 0) {
                resultsDiv.innerHTML = '<div style="color:var(--text-muted);padding:20px 0;font-size:13px;text-align:center;">未找到匹配结果</div>';
                statsDiv.style.display = 'none';
                return;
            }

            resultsDiv.innerHTML = results.map(r => {
                const iconHTML = r.isTitleMatch
                    ? '<div class="search-result-icon" style="font-weight:700;">#</div>'
                    : (r.role === 'user'
                        ? '<div class="search-result-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg></div>'
                        : '<div class="search-result-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>');
                const roleTag = r.isTitleMatch ? '' : `<span class="search-result-role">${r.role === 'user' ? '你' : 'AI'}</span>`;
                const previewHTML = r.isTitleMatch ? ''
                    : `<div class="search-result-preview">${highlightText(escapeHtml(r.preview), query)}</div>`;
                return `
                    <div class="search-result-item" onclick="navigateToSession('${r.sessionId}')">
                        <div class="search-result-header">
                            ${iconHTML}
                            <span class="search-result-title">${highlightText(escapeHtml(r.title), query)}</span>
                            ${roleTag}
                        </div>
                        ${previewHTML}
                    </div>`;
            }).join('');

            statsDiv.style.display = 'flex';
            statsDiv.innerHTML = `
                <span class="stats-count">找到 ${results.length} 条结果</span>
                <span class="stats-close" onclick="closeSearchModal()">Esc 关闭</span>`;
        }

        function highlightText(text, query) {
            if (!query) return text;
            const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
        }

        function navigateToSession(id) {
            closeSearchModal();
            const numId = Number(id);
            const s = sessions.find(s => s.id === numId);
            if (!s) return;
            // 如果目标会话模式与当前不同，先设置对应模式 ID，再切换到该模式
            if (s.type === 'gen' && !imageGenMode) {
                currentGenSessionId = numId;
                setMode('gen');
            } else if (s.type === 'chat' && imageGenMode) {
                currentChatSessionId = numId;
                setMode('chat');
            } else {
                switchChat(numId);
            }
        }

        // ============================================================
        //  聊天会话管理 (CRUD)
        // ============================================================
        let sessions = [];
        let currentChatSessionId = null;
        let currentGenSessionId = null;
        let lastRenderedSessionId = null; // 避免切模式时无意义重建聊天区

        function getCurrentId() {
            return imageGenMode ? currentGenSessionId : currentChatSessionId;
        }

        async function saveSessionsToStorage() {
            try {
                await dbSet('sessions', { sessions, currentChatSessionId, currentGenSessionId });
            } catch(e) {}
        }

        async function loadSessionsFromStorage() {
            try {
                const saved = await dbGet('sessions');
                if (saved) {
                    sessions = saved.sessions || [];
                    currentChatSessionId = saved.currentChatSessionId || null;
                    currentGenSessionId = saved.currentGenSessionId || null;
                }
            } catch(e) {}
            // 确保每种模式至少有一个会话
            const hasChat = sessions.some(s => s.type === 'chat');
            const hasGen = sessions.some(s => s.type === 'gen');
            if (!hasChat) {
                const id = Date.now();
                sessions.unshift({ id, title: "新会话", messages: [], presetId: activePresetId, pinned: false, type: 'chat' });
                currentChatSessionId = id;
            }
            if (!hasGen) {
                const id = Date.now() + 1;
                sessions.unshift({ id, title: "新会话", messages: [], presetId: null, pinned: false, type: 'gen' });
                currentGenSessionId = id;
            }
            // 校验当前 ID 存在
            if (!sessions.find(s => s.id === currentChatSessionId)) {
                currentChatSessionId = sessions.find(s => s.type === 'chat')?.id || null;
            }
            if (!sessions.find(s => s.id === currentGenSessionId)) {
                currentGenSessionId = sessions.find(s => s.type === 'gen')?.id || null;
            }
        }

        function createNewChat() {
            const newId = Date.now();
            const sType = imageGenMode ? 'gen' : 'chat';
            sessions.unshift({ id: newId, title: "新会话", messages: [], presetId: sType === 'chat' ? activePresetId : null, pinned: false, type: sType });
            switchChat(newId);
            saveSessionsToStorage();
            closeSidebarOnMobile();
        }

        function deleteChat(id, event) {
            event.stopPropagation(); 
            const deletedType = sessions.find(s => s.id === id)?.type;
            sessions = sessions.filter(s => s.id !== id);
            const modeSessions = sessions.filter(s => s.type === (imageGenMode ? 'gen' : 'chat'));
            if (modeSessions.length === 0) createNewChat();
            else if (getCurrentId() === id) switchChat(modeSessions[0].id);
            else renderSidebar();
            saveSessionsToStorage();
            showToast('会话已删除');
        }

        function togglePin(id, event) {
            event.stopPropagation();
            const session = sessions.find(s => s.id === id);
            if (!session) return;
            session.pinned = !session.pinned;
            saveSessionsToStorage();
            renderSidebar();
            showToast(session.pinned ? '已置顶' : '已取消置顶');
        }

        function switchChat(id) {
            // 收藏模式下点击会话，先切换到对应模式
            if (favMode) {
                const s = sessions.find(s => s.id === id);
                if (s) setMode(s.type === 'gen' ? 'gen' : 'chat');
                else setMode('chat');
                return;
            }
            // 同一个 session 则跳过
            const prevId = getCurrentId();
            if (id === prevId && id === lastRenderedSessionId) return;
            const s = sessions.find(s => s.id === id);
            if (s) {
                if (s.type === 'gen') currentGenSessionId = id;
                else currentChatSessionId = id;
            }
            // 不在切模式时写 IndexedDB（session 内容未变，只改当前 ID）
            // 同步该会话的预设
            if (s && s.presetId != null && paramPresets.find(p => p.id === s.presetId)) {
                activePresetId = s.presetId;
                savePresets();
                renderPresetTags();
            }
            renderSidebar();
            // 只有会话 ID 变化才重建聊天区（避免 base64 图片重新解码）
            if (id !== lastRenderedSessionId) {
                lastRenderedSessionId = id;
                renderChatArea();
            }
            // 移动端选择会话后自动收起侧边栏
            closeSidebarOnMobile();
        }

        function closeSidebarOnMobile() {
            if (window.innerWidth <= 768) {
                const mobileOverlay = document.getElementById('sidebarMobileOverlay');
                if (!sidebar.classList.contains('hidden')) {
                    sidebar.classList.add('hidden');
                }
                if (mobileOverlay) mobileOverlay.classList.remove('show');
            }
        }

        // ============================================================
        //  侧边栏渲染
        // ============================================================
        // ============================================================
        //  多选模式
        // ============================================================
        let multiSelectMode = false;
        const selectedSessions = new Set();

        function toggleMultiSelect() {
            multiSelectMode = !multiSelectMode;
            if (!multiSelectMode) selectedSessions.clear();
            document.getElementById('sidebar').classList.toggle('multi-select-mode', multiSelectMode);
            document.getElementById('multiSelectBar').classList.toggle('show', multiSelectMode);
            renderSidebar();
            updateMultiSelectCount();
        }

        // 全选/取消全选：当前模式所有会话
        function selectAll() {
            const modeType = imageGenMode ? 'gen' : 'chat';
            const modeSessions = sessions.filter(s => s.type === modeType);
            const allSelected = modeSessions.every(s => selectedSessions.has(s.id));
            if (allSelected) modeSessions.forEach(s => selectedSessions.delete(s.id));
            else modeSessions.forEach(s => selectedSessions.add(s.id));
            renderSidebar();
            updateMultiSelectCount();
        }

        function toggleSessionSelection(id) {
            if (selectedSessions.has(id)) selectedSessions.delete(id);
            else selectedSessions.add(id);
            renderSidebar();
            updateMultiSelectCount();
        }

        function updateMultiSelectCount() {
            document.getElementById('msCount').textContent = `已选 ${selectedSessions.size} 项`;
        }

        function batchDelete() {
            if (selectedSessions.size === 0) { showToast('未选择会话'); return; }
            const count = selectedSessions.size;
            const deletedCurrent = selectedSessions.has(getCurrentId());
            sessions = sessions.filter(s => !selectedSessions.has(s.id));
            selectedSessions.clear();
            const modeSessions = sessions.filter(s => s.type === (imageGenMode ? 'gen' : 'chat'));
            if (modeSessions.length === 0) createNewChat();
            else if (deletedCurrent) switchChat(modeSessions[0].id);
            else renderSidebar();
            saveSessionsToStorage();
            updateMultiSelectCount();
            showToast(`已删除 ${count} 个会话`);
        }

        function batchPin() {
            if (selectedSessions.size === 0) { showToast('未选择会话'); return; }
            sessions.forEach(s => { if (selectedSessions.has(s.id)) s.pinned = true; });
            saveSessionsToStorage();
            renderSidebar();
            showToast(`已置顶 ${selectedSessions.size} 个会话`);
        }

        function batchUnpin() {
            if (selectedSessions.size === 0) { showToast('未选择会话'); return; }
            sessions.forEach(s => { if (selectedSessions.has(s.id)) s.pinned = false; });
            saveSessionsToStorage();
            renderSidebar();
            showToast(`已取消置顶 ${selectedSessions.size} 个会话`);
        }

        function renderSidebar() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            const modeType = imageGenMode ? 'gen' : 'chat';
            const modeSessions = sessions.filter(s => s.type === modeType);
            const sortedSessions = [...modeSessions].sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return 0;
            });
            sortedSessions.forEach(session => {
                const item = document.createElement('div');
                const isSelected = selectedSessions.has(session.id);
                item.className = `chat-history-item ${session.id === getCurrentId() ? 'active' : ''} ${isSelected ? 'selected' : ''}`;
                // 多选模式下点击切换选中，非多选模式切换会话
                item.onclick = () => {
                    if (multiSelectMode) toggleSessionSelection(session.id);
                    else switchChat(session.id);
                };

                const checkbox = document.createElement('div');
                checkbox.className = `chat-checkbox ${isSelected ? 'checked' : ''}`;

                const title = document.createElement('span');
                title.className = 'chat-title';
                title.textContent = session.title;

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'chat-history-icons';
                
                const pinIcon = document.createElement('div');
                const isPinned = session.pinned;
                pinIcon.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" style="color:${isPinned?'#d4a017':'inherit'}"><path d="M16 3v5c0 .8.3 1.6.9 2.2l1.1 1.1V13H6v-1.7l1.1-1.1c.6-.6.9-1.3.9-2.2V3h8z"></path><line x1="12" y1="13" x2="12" y2="21"></line><line x1="8" y1="21" x2="16" y2="21"></line></svg>`;
                pinIcon.style.cursor = 'pointer';
                pinIcon.title = isPinned ? '取消置顶' : '置顶';
                pinIcon.onclick = (e) => togglePin(session.id, e);

                const editIcon = document.createElement('div');
                editIcon.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>';
                editIcon.onclick = (e) => openRenameModal(session.id, session.title, e);

                const delIcon = document.createElement('div');
                delIcon.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
                delIcon.onclick = (e) => deleteChat(session.id, e);

                actionsDiv.appendChild(pinIcon);
                actionsDiv.appendChild(editIcon);
                actionsDiv.appendChild(delIcon);
                item.appendChild(checkbox);
                item.appendChild(title);
                item.appendChild(actionsDiv);
                list.appendChild(item);
            });
        }

        // ============================================================
        //  消息锚点导航条
        // ============================================================
        const messageAnchors = document.getElementById('messageAnchors');
        const anchorTooltip = document.getElementById('anchorTooltip');
        let anchorObserver = null;
        let anchorTexts = [];

        let hideTooltipTimeout = null;

        function bindTooltipClicks() {
            anchorTooltip.querySelectorAll('.anchor-tooltip-item').forEach(item => {
                item.addEventListener('click', () => {
                    const idx = parseInt(item.getAttribute('data-idx'));
                    const blocks = chatInner.querySelectorAll('.user-block');
                    if (blocks[idx]) {
                        blocks[idx].scrollIntoView({ block: 'start' });
                    }
                });
            });
        }

        function buildTooltipHTML(currentIndex) {
            if (anchorTexts.length === 0) return '';
            let html = '';
            anchorTexts.forEach((text, i) => {
                const cls = i === currentIndex ? ' anchor-tooltip-item current' : 'anchor-tooltip-item';
                html += `<div class="${cls}" data-idx="${i}"><span class="anchor-text">${escapeHtml(text)}</span><span class="anchor-dash">—</span></div>`;
            });
            return html;
        }

        function positionTooltip(refRect) {
            if (!anchorTooltip) return;
            let left = refRect.left - anchorTooltip.offsetWidth - 14;
            let top = refRect.top + refRect.height / 2 - anchorTooltip.offsetHeight / 2;
            if (left < 8) left = 8;
            if (top < 8) top = 8;
            if (top + anchorTooltip.offsetHeight > window.innerHeight - 8) {
                top = window.innerHeight - anchorTooltip.offsetHeight - 8;
            }
            anchorTooltip.style.left = left + 'px';
            anchorTooltip.style.top = top + 'px';
        }

        function showAnchorTooltipAt(refRect, currentIndex) {
            if (!anchorTooltip || anchorTexts.length === 0) return;
            anchorTooltip.innerHTML = buildTooltipHTML(currentIndex);
            anchorTooltip.classList.add('show');
            positionTooltip(refRect);
            bindTooltipClicks();
        }

        function hideAnchorTooltip(delayed) {
            if (!anchorTooltip) return;
            if (delayed) {
                clearTimeout(hideTooltipTimeout);
                hideTooltipTimeout = setTimeout(() => {
                    anchorTooltip.classList.remove('show');
                }, 150);
            } else {
                clearTimeout(hideTooltipTimeout);
                anchorTooltip.classList.remove('show');
            }
        }

        // 整个锚点条带和 tooltip 区域协同显示/隐藏
        if (messageAnchors) {
            messageAnchors.addEventListener('mouseenter', () => {
                clearTimeout(hideTooltipTimeout);
                showAnchorTooltipAt(messageAnchors.getBoundingClientRect(), -1);
            });
            messageAnchors.addEventListener('mouseleave', () => hideAnchorTooltip(true));
        }
        if (anchorTooltip) {
            anchorTooltip.addEventListener('mouseenter', () => {
                clearTimeout(hideTooltipTimeout);
                anchorTooltip.classList.add('show');
            });
            anchorTooltip.addEventListener('mouseleave', () => hideAnchorTooltip(true));
        }

        function updateMessageAnchors() {
            if (!messageAnchors) return;
            hideAnchorTooltip();
            const allBlocks = chatInner.querySelectorAll('.message-block');
            const blocks = Array.from(allBlocks).filter(b => b.classList.contains('user-block'));
            messageAnchors.innerHTML = '';

            // 收集所有用户消息文本
            anchorTexts = blocks.map(block => {
                const contentEl = block.querySelector('.message-content');
                return contentEl ? (contentEl.textContent || contentEl.getAttribute('data-raw') || '').substring(0, 20).trim() : '';
            });

            // 每次更新时清空 tooltip 内容
            if (anchorTooltip) anchorTooltip.innerHTML = '';

            if (blocks.length === 0) {
                messageAnchors.classList.add('hidden');
                if (anchorObserver) anchorObserver.disconnect();
                return;
            }
            messageAnchors.classList.remove('hidden');

            blocks.forEach((block, i) => {
                block.setAttribute('data-anchor-index', i);
                const dot = document.createElement('div');
                dot.className = 'anchor-dot';
                dot.title = '你的消息';
                // 悬停时更新当前高亮项
                dot.addEventListener('mouseenter', () => {
                    if (anchorTooltip && anchorTooltip.classList.contains('show')) {
                        anchorTooltip.innerHTML = buildTooltipHTML(i);
                        bindTooltipClicks();
                    }
                });
                dot.addEventListener('click', () => {
                    block.scrollIntoView({ block: 'start' });
                });
                messageAnchors.appendChild(dot);
            });

            // 重建 observer
            if (anchorObserver) anchorObserver.disconnect();
            anchorObserver = new IntersectionObserver((entries) => {
                let bestIdx = -1, bestRatio = 0;
                entries.forEach(e => {
                    if (e.intersectionRatio > bestRatio && e.isIntersecting) {
                        bestRatio = e.intersectionRatio;
                        bestIdx = parseInt(e.target.getAttribute('data-anchor-index'));
                    }
                });
                const dots = messageAnchors.querySelectorAll('.anchor-dot');
                dots.forEach(d => d.classList.remove('active'));
                if (bestIdx >= 0 && dots[bestIdx]) {
                    dots[bestIdx].classList.add('active');
                }
            }, { root: chatContainer, threshold: [0, 0.25, 0.5, 0.75, 1] });

            blocks.forEach(b => anchorObserver.observe(b));
        }

        // ============================================================
        //  聊天区域渲染
        // ============================================================
        const chatContainer = document.getElementById('chatContainer');
        const chatInner = document.getElementById('chatInner');
        const welcomeScreen = document.getElementById('welcomeScreen');

        function renderChatArea() {
            const session = sessions.find(s => s.id === getCurrentId());
            // 清空除了 welcomeScreen 以外的所有消息块
            Array.from(chatInner.children).forEach(child => {
                if(child.id !== 'welcomeScreen') child.remove();
            });

            if (session.messages.length === 0) {
                welcomeScreen.style.display = 'block';
                updateMessageAnchors();
            } else {
                welcomeScreen.style.display = 'none';
                session.messages.forEach((msg, idx) => {
                    // 【网络搜索/TinyFish】【消息渲染】跳过中间过渡的工具调用、系统角色消息或无内容的过渡助手消息，只渲染用户和最终的助手回复
                    if (msg.role === 'tool' || msg.role === 'system' || (msg.role === 'assistant' && !msg.content && msg.tool_calls && msg.tool_calls.length > 0)) {
                        return;
                    }
                    let displayContent, imageUrl;
                    let displayModel = msg.model;
                    let displayThought = msg.thought;
                    let displayPresetId = msg.presetId;
                    let displayGenImages = msg.images || null;
                    let displayGenParams = msg.genParams || null;
                    // 如果有版本历史且正在查看旧版本，使用旧版本内容
                    let displayIsHtml = msg.isHtml || false;
                    if (msg.role === 'assistant' && msg.versions && msg.versions.length > 0) {
                        const dv = msg.displayVersionIdx || 0;
                        if (dv > 0 && msg.versions[dv - 1]) {
                            const ver = msg.versions[dv - 1];
                            displayContent = ver.content;
                            displayModel = ver.model || msg.model;
                            displayThought = ver.thought || msg.thought;
                            displayPresetId = ver.presetId != null ? ver.presetId : msg.presetId;
                            displayIsHtml = ver.isHtml != null ? ver.isHtml : displayIsHtml;
                            displayGenImages = ver.images || displayGenImages;
                            displayGenParams = ver.genParams || displayGenParams;
                        } else if (Array.isArray(msg.content)) {
                            const textPart = msg.content.find(c => c.type === 'text');
                            displayContent = textPart ? textPart.text : '';
                        } else {
                            displayContent = msg.content;
                        }
                    } else if (Array.isArray(msg.content)) {
                        const textPart = msg.content.find(c => c.type === 'text');
                        displayContent = textPart ? textPart.text : '';
                        // 提取所有图片 URL，支持多图显示
                        const imgParts = msg.content.filter(c => c.type === 'image_url');
                        imageUrl = imgParts.length > 0 ? imgParts.map(p => p.image_url.url) : null;
                    } else {
                        displayContent = msg.content;
                    }
                    appendMessageDOM(msg.role, displayContent, displayThought, imageUrl, displayModel, idx, displayPresetId, displayIsHtml, displayGenImages, displayGenParams);
                });
            }
            updateMessageAnchors();
            // 【网络搜索/TinyFish】【恢复历史】每次重绘聊天区时，根据最新消息历史恢复右侧搜索面板状态
            restoreSearchProcess();
        }

        function regenerateMessage(btn) {
            const block = btn.closest('.message-block');
            const allBlocks = Array.from(chatInner.querySelectorAll('.message-block'));
            const index = allBlocks.indexOf(block);
            if (index === -1) return;

            const currentSession = sessions.find(s => s.id === getCurrentId());
            const msg = currentSession.messages[index];
            // 保存当前回复到版本历史
            if (msg && msg.role === 'assistant') {
                pendingVersions = (msg.versions || []).slice();
                pendingVersions.push({ content: msg.content, thought: msg.thought, model: msg.model, presetId: msg.presetId, isHtml: msg.isHtml, images: msg.images, genParams: msg.genParams });
            }
            // 生图模式：保留当前用户消息作为提示词，不额外添加用户消息
            if (imageGenMode) {
                const userMsg = currentSession.messages[index - 1];
                if (userMsg && userMsg.role === 'user') {
                    const prompt = typeof userMsg.content === 'string' ? userMsg.content : '';
                    if (prompt) {
                        currentSession.messages = currentSession.messages.slice(0, index);
                        saveSessionsToStorage();
                        renderChatArea();
                        sendImageGeneration(prompt, true);
                        return;
                    }
                }
            }
            currentSession.messages = currentSession.messages.slice(0, index);
            saveSessionsToStorage();
            renderChatArea();
            fetchAIResponse();
        }

        // ============================================================
        //  消息编辑 (inline) / 删除 / 版本切换
        // ============================================================
        let editingMessageIndex = null;
        let pendingVersions = null;

        function editMessage(btnEl) {
            const block = btnEl.closest('.message-block');
            const contentEl = block.querySelector('.message-content');
            const idx = parseInt(contentEl.getAttribute('data-index'));
            if (isNaN(idx)) return;
            
            editingMessageIndex = idx;
            const session = sessions.find(s => s.id === getCurrentId());
            if (!session) return;
            const msg = session.messages[idx];
            if (!msg) return;
            
            const originalContent = Array.isArray(msg.content)
                ? msg.content.filter(c => c.type === 'text').map(c => c.text).join('\n')
                : (msg.content || '');
            
            // 将内容替换为文本框进行内联编辑
            const textarea = document.createElement('textarea');
            textarea.id = 'editingTextarea';
            textarea.value = originalContent;
            Object.assign(textarea.style, {
                width: '100%', minHeight: '60px', padding: '10px 14px',
                border: '2px solid var(--black-btn)', borderRadius: '10px', fontSize: '14px',
                resize: 'vertical', fontFamily: 'inherit', outline: 'none',
                background: 'var(--bg-surface)', lineHeight: '1.5', color: 'var(--text-main)'
            });
            textarea.onkeydown = (e) => {
                if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
            };
            
            const wrapper = contentEl.closest('.collapse-wrapper');
            const targetParent = wrapper || contentEl.parentElement;
            if (wrapper) {
                wrapper.classList.remove('collapsed');
                const toggleBtn = wrapper.parentElement.querySelector('.collapse-toggle');
                if (toggleBtn) toggleBtn.style.display = 'none';
            }
            targetParent.replaceChild(textarea, contentEl);
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);
            
            const actionsDiv = block.querySelector('.message-actions');
            actionsDiv.setAttribute('data-original-html', actionsDiv.innerHTML);
            actionsDiv.innerHTML = `
                <span onclick="cancelEdit()" style="cursor:pointer;font-size:12px;color:var(--text-muted);border:1px solid var(--border-color);border-radius:12px;padding:3px 10px;user-select:none;transition:all 0.15s;" onmouseover="this.style.borderColor='var(--text-main)';this.style.color='var(--text-main)'" onmouseout="this.style.borderColor='';this.style.color=''">取消</span>
                <span onclick="saveEdit()" style="cursor:pointer;font-size:12px;background:var(--text-main);color:var(--text-on-dark);border-radius:12px;padding:3px 12px;user-select:none;transition:all 0.15s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">保存并重新生成</span>
            `;
        }

        function cancelEdit() {
            editingMessageIndex = null;
            renderChatArea();
        }

        function saveEdit() {
            if (editingMessageIndex === null) return;
            const textarea = document.getElementById('editingTextarea');
            if (!textarea) return;
            const newText = textarea.value.trim();
            if (!newText) { showToast('内容不能为空'); return; }
            
            const session = sessions.find(s => s.id === getCurrentId());
            if (!session) return;
            const msg = session.messages[editingMessageIndex];
            if (!msg) return;
            
            // 如果原消息包含图片，保留图片部分
            if (Array.isArray(msg.content)) {
                const imgParts = msg.content.filter(c => c.type === 'image_url');
                msg.content = imgParts.length > 0
                    ? [{ type: 'text', text: newText }, ...imgParts]
                    : newText;
            } else {
                msg.content = newText;
            }
            
            // 保存原助手回复到版本历史
            const oldAsIdx = editingMessageIndex + 1;
            const oldAs = session.messages[oldAsIdx];
            if (oldAs && oldAs.role === 'assistant') {
                pendingVersions = (oldAs.versions || []).slice();
                pendingVersions.push({ content: oldAs.content, thought: oldAs.thought, model: oldAs.model, presetId: oldAs.presetId, isHtml: oldAs.isHtml, images: oldAs.images });
            }
            // 截断消息列表，仅保留到当前编辑的用户消息及之前的消息
            session.messages = session.messages.slice(0, editingMessageIndex + 1);
            
            editingMessageIndex = null;
            saveSessionsToStorage();
            renderChatArea();
            showToast('已保存，正在重新生成...');
            // 生图模式走生图接口（用户消息已编辑好，无需再添加）
            if (imageGenMode) {
                sendImageGeneration(newText, true);
                return;
            }
            fetchAIResponse();
        }

        function deleteMessage(btnEl) {
            const block = btnEl.closest('.message-block');
            const contentEl = block.querySelector('.message-content');
            const idx = parseInt(contentEl.getAttribute('data-index'));
            if (isNaN(idx)) return;
            
            const session = sessions.find(s => s.id === getCurrentId());
            if (!session) return;
            
            if (block.classList.contains('user-block')) {
                // 【会话管理/系统】【安全删除】删除用户消息以及其后关联的所有过渡消息和助手回答，直至遇到下一条用户消息
                let removeCount = 1;
                while (idx + removeCount < session.messages.length && session.messages[idx + removeCount].role !== 'user') {
                    removeCount++;
                }
                session.messages.splice(idx, removeCount);
            } else {
                const msg = session.messages[idx];
                // 有版本历史时，仅删除当前正在查看的版本
                if (msg && msg.versions && msg.versions.length > 0) {
                    const dv = msg.displayVersionIdx || 0;
                    if (dv === 0) {
                        // 删除当前最新版本，用上一个版本替换
                        const last = msg.versions.pop();
                        msg.content = last.content;
                        msg.thought = last.thought;
                        msg.model = last.model;
                        msg.displayVersionIdx = 0;
                        if (msg.versions.length === 0) delete msg.versions;
                        if (msg.displayVersionIdx === 0) delete msg.displayVersionIdx;
                        
                        // 【会话管理/系统】【安全删除】退回上一个版本时，连带清除当前最新版本生成期间的过渡工具调用消息
                        let startDelIdx = idx;
                        while (startDelIdx > 0 && session.messages[startDelIdx - 1].role !== 'user') {
                            startDelIdx--;
                        }
                        if (startDelIdx < idx) {
                            session.messages.splice(startDelIdx, idx - startDelIdx);
                        }
                    } else {
                        // 删除旧版本
                        msg.versions.splice(dv - 1, 1);
                        msg.displayVersionIdx = Math.min(msg.displayVersionIdx, msg.versions.length);
                        if (msg.versions.length === 0) delete msg.versions;
                        if (msg.displayVersionIdx === 0) delete msg.displayVersionIdx;
                    }
                    saveSessionsToStorage();
                    renderChatArea();
                    showToast('版本已删除');
                    return;
                }
                // 无版本历史，删除整条助手消息及相关的过渡工具消息
                let startDelIdx = idx;
                while (startDelIdx > 0 && session.messages[startDelIdx - 1].role !== 'user') {
                    startDelIdx--;
                }
                // 【会话管理/系统】【安全删除】删除当前助手回答并连带清理对应的所有过渡工具调用消息
                session.messages.splice(startDelIdx, idx - startDelIdx + 1);
            }
            
            if (session.messages.length === 0) {
                session.title = '新会话';
            }
            
            saveSessionsToStorage();
            renderChatArea();
            showToast('消息已删除');
        }

        function switchVersion(spanEl, direction) {
            const nav = spanEl.closest('.version-nav');
            const idx = parseInt(nav.getAttribute('data-msg-idx'));
            if (isNaN(idx)) return;
            const session = sessions.find(s => s.id === getCurrentId());
            if (!session) return;
            const msg = session.messages[idx];
            if (!msg || !msg.versions) return;
            if (msg.displayVersionIdx == null) msg.displayVersionIdx = 0;
            msg.displayVersionIdx += direction;
            const maxIdx = msg.versions.length;
            if (msg.displayVersionIdx < 0) msg.displayVersionIdx = 0;
            if (msg.displayVersionIdx > maxIdx) msg.displayVersionIdx = maxIdx;
            saveSessionsToStorage();
            renderChatArea();
        }

        // ============================================================
        //  消息 DOM 构建 & 长内容折叠
        // ============================================================
        const COLLAPSE_THRESHOLD = 300; // 内容超过此字符数时自动折叠

        function appendMessageDOM(role, content, thought = null, imageUrl = null, msgModel = null, msgIndex = null, msgPresetId = null, isHtml = false, genImages = null, genParams = null) {
            welcomeScreen.style.display = 'none';
            
            const blockDiv = document.createElement('div');
            blockDiv.className = `message-block ${role}-block`;

            if (role === 'assistant' && thought) {
                const thoughtDiv = document.createElement('div');
                thoughtDiv.className = 'thought-process';
                // __thinking__ 标记：显示思考中动效（跳动点 + 思考中文案），不显示折叠箭头
                const isThinking = thought === '__thinking__';
                const thoughtHtml = isThinking ? '' : (thought.trimStart().startsWith('<') ? thought : marked.parse(unwrapMathFromCode(thought)));
                const barInner = isThinking
                    ? '<span class="thinking-dots"><span></span><span></span><span></span></span><span class="thought-label">思考中</span>'
                    : '<span class="thought-label">思考过程</span><svg class="thought-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>';
                thoughtDiv.innerHTML = `
                    <div class="thought-bar">
                        ${barInner}
                    </div>
                    <div class="thought-content">${thoughtHtml}</div>
                `;
                if (isThinking) thoughtDiv.classList.add('thinking');
                blockDiv.appendChild(thoughtDiv);
            }

            let safeContent = content;
            if (Array.isArray(content)) {
                const textItem = content.find(c => c.type === 'text');
                safeContent = textItem ? textItem.text : '';
            } else if (typeof content !== 'string') {
                safeContent = String(content || '');
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            // 保存原始内容（Markdown 格式）
            contentDiv.setAttribute('data-raw', safeContent);
            if (msgIndex != null) contentDiv.setAttribute('data-index', msgIndex);
            if (safeContent) {
                let displayHtml = isHtml ? safeContent : marked.parse(unwrapMathFromCode(safeContent)).trim();
                // 生图占位符替换：src="" data-gen-idx="N" data-gen-src="" → src="data:..."
                if (role === 'assistant' && isHtml && genImages && genImages.length > 0) {
                    genImages.forEach((img, i) => {
                        const dataUrl = 'data:' + (img.type || 'image/png') + ';base64,' + img.b64;
                        displayHtml = displayHtml.split('src="" data-gen-idx="' + i + '" data-gen-src=""').join('src="' + dataUrl + '"');
                    });
                }
                contentDiv.innerHTML = displayHtml;
            } else {
                contentDiv.textContent = '';
            }

            // 长内容自动折叠（仅对 user 消息生效，默认折叠，不持久化）
            if (role === 'user' && content && content.length > COLLAPSE_THRESHOLD && msgIndex != null) {
                const wrapper = document.createElement('div');
                wrapper.className = 'collapse-wrapper collapsed';
                wrapper.appendChild(contentDiv);
                
                const toggleBtn = document.createElement('span');
                toggleBtn.className = 'collapse-toggle';
                const updateToggleLabel = () => {
                    toggleBtn.textContent = wrapper.classList.contains('collapsed') ? '展开全文 ▼' : '收起 ▲';
                };
                updateToggleLabel();
                toggleBtn.onclick = () => {
                    wrapper.classList.toggle('collapsed');
                    updateToggleLabel();
                };
                
                msgDiv.appendChild(wrapper);
                msgDiv.appendChild(toggleBtn);
            } else {
                msgDiv.appendChild(contentDiv);
            }
            if (imageUrl) {
                // imageUrl 可以是单个 base64 字符串或数组（多图）
                const urls = Array.isArray(imageUrl) ? imageUrl : [imageUrl];
                for (const url of urls) {
                    const img = document.createElement('img');
                    img.src = url;
                    img.className = 'user-image';
                    img.onclick = () => window.open(url, '_blank');
                    msgDiv.appendChild(img);
                }
            }
            blockDiv.appendChild(msgDiv);

            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'message-actions';
            if (role === 'user') {
                actionsDiv.innerHTML = `
                    <svg onclick="editMessage(this)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="编辑"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                    <svg onclick="copyMessageText(this)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="复制"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <svg onclick="deleteMessage(this)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="删除"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                `;
            } else {
                const session = sessions.find(s => s.id === getCurrentId());
                const fallbackPresetId = (msgPresetId != null) ? msgPresetId : (session?.presetId);
                const msgPreset = (fallbackPresetId != null) ? paramPresets.find(p => p.id === fallbackPresetId) : getActivePreset();
                const presetName = (!imageGenMode && msgPreset?.name) || '';
                const presetTagHtml = presetName ? `<span class="msg-preset-tag">${escapeHtml(presetName)}</span>` : '';
                const displayModel = msgModel || activeModel;
                const msgLogo = msgModel ? getLogoForModel(msgModel) : getActiveLogo();
                const msgLogoHtml = renderLogoHtml(msgLogo, true);
                // 版本切换导航
                const msg = (session && msgIndex != null) ? session.messages[msgIndex] : null;
                const versions = (msg && msg.versions) ? msg.versions : [];
                const dv = (msg && msg.displayVersionIdx != null) ? msg.displayVersionIdx : 0;
                const totalVersions = versions.length + 1;
                let versionNavHtml = '';
                if (totalVersions > 1) {
                    const currentVer = totalVersions - dv;
                    versionNavHtml = `<span class="version-nav" data-msg-idx="${msgIndex}" style="display:inline-flex;align-items:center;gap:3px;user-select:none;flex-shrink:0;">
                        <span onclick="event.stopPropagation();switchVersion(this,1)" style="cursor:pointer;opacity:0.4;font-size:16px;transition:opacity 0.15s;line-height:1;font-weight:600;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='0.4'">◂</span>
                        <span style="font-size:12px;color:var(--text-muted);">${currentVer}/${totalVersions}</span>
                        <span onclick="event.stopPropagation();switchVersion(this,-1)" style="cursor:pointer;opacity:0.4;font-size:16px;transition:opacity 0.15s;line-height:1;font-weight:600;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='0.4'">▸</span>
                    </span>`;
                }
                const delTitle = totalVersions > 1 ? '删除此版本' : '删除此回复';
                // 生图消息不显示复制按钮（HTML 内容无意义）
                const copyBtn = isHtml ? '' : `<svg onclick="copyMessageText(this)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="复制"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
                // 生图消息：在删除按钮右边添加下载和收藏
                const isFavd = isHtml && isGenMsgFavorited(msg);
                const favHeartSvg = isFavd
                    ? `<svg onclick="favGenBlockImages(this)" width="14" height="14" viewBox="0 0 24 24" stroke="none" style="fill:#e74c3c;color:#e74c3c;cursor:pointer;" title="已收藏"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`
                    : `<svg onclick="favGenBlockImages(this)" width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="fill:none;" title="收藏图片"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;
                // 生图参数摘要
                let genParamsHtml = '';
                if (isHtml && genParams) {
                    const gp = genParams;
                    const parts = [];
                    parts.push(gp.size);
                    if (gp.steps && gp.steps !== 9) parts.push('步' + gp.steps);
                    if (gp.guidance && gp.guidance !== 1) parts.push('引导' + gp.guidance);
                    if (gp.seed) parts.push('种' + gp.seed);
                    if (gp.control) parts.push(gp.control);
                    parts.push('图尺' + gp.imgScale);
                    genParamsHtml = `<span class="msg-genparams-tag">${escapeHtml(parts.join(' · '))}</span>`;
                }
                const genExtraBtns = isHtml ? `
                    <svg onclick="downloadGenBlockImages(this)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="下载全部图片"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    ${favHeartSvg}
                ` : '';
                actionsDiv.innerHTML = `
                    <svg onclick="regenerateMessage(this)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="重新生成"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    ${copyBtn}
                    <svg onclick="deleteMessage(this)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="${delTitle}"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    ${genExtraBtns}
                    ${versionNavHtml}
                    <span class="msg-model-tag" onclick="event.stopPropagation(); retryWithDropdown(this.closest('.message-block'))">${msgLogoHtml}${escapeHtml(displayModel)}</span>
                    ${genParamsHtml}
                    ${presetTagHtml}
                `;
            }
            blockDiv.appendChild(actionsDiv);

            chatInner.appendChild(blockDiv);
            // 代码高亮、数学公式与 Mermaid 渲染（思考段与正文段统一处理）
            highlightCodeBlocks(blockDiv);
            renderMath(blockDiv);
            renderMermaid(blockDiv);
            // 添加新消息后自动滚动到底部
            requestAnimationFrame(() => { chatContainer.scrollTop = chatContainer.scrollHeight; });
            updateMessageAnchors();
            return contentDiv; 
        }

        // ============================================================
        //  文件上传与粘贴 (多图)
        // ============================================================
        // pendingFiles 存储待发送的图片数组，每项为 { base64, name }
        let pendingFiles = [];

        // 处理文件选择：支持多文件，逐个读取为 base64 加入 pendingFiles
        function handleFileSelected(input) {
            if (!input.files || input.files.length === 0) return;
            const files = Array.from(input.files);
            for (const file of files) {
                if (!file.type.startsWith('image/')) { showToast('仅支持图片文件'); continue; }
                const reader = new FileReader();
                reader.onload = (e) => {
                    pendingFiles.push({ base64: e.target.result, name: file.name });
                    renderImagePreview();
                };
                reader.readAsDataURL(file);
            }
            input.value = '';
        }

        // 粘贴事件：从剪贴板提取图片文件加入 pendingFiles
        function handlePaste(e) {
            const items = e.clipboardData?.items;
            if (!items) return;
            let hasImage = false;
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    hasImage = true;
                    const file = item.getAsFile();
                    if (!file) continue;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        pendingFiles.push({ base64: ev.target.result, name: `粘贴图片_${Date.now()}.png` });
                        renderImagePreview();
                    };
                    reader.readAsDataURL(file);
                }
            }
            if (hasImage) e.preventDefault();
        }

        // 渲染图片预览网格：每张图缩略图 + hover 删除按钮
        function renderImagePreview() {
            const area = document.getElementById('imagePreviewArea');
            const grid = document.getElementById('imagePreviewGrid');
            if (pendingFiles.length === 0) {
                area.style.display = 'none';
                grid.innerHTML = '';
                return;
            }
            area.style.display = 'flex';
            grid.innerHTML = '';
            pendingFiles.forEach((file, idx) => {
                const item = document.createElement('div');
                item.className = 'image-preview-item';
                const img = document.createElement('img');
                img.src = file.base64;
                img.title = file.name;
                const removeBtn = document.createElement('span');
                removeBtn.className = 'img-remove-btn';
                removeBtn.innerHTML = '&times;';
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    pendingFiles.splice(idx, 1);
                    renderImagePreview();
                };
                item.appendChild(img);
                item.appendChild(removeBtn);
                grid.appendChild(item);
            });
        }

        // 清除所有图片预览
        function clearImagePreview() {
            pendingFiles = [];
            renderImagePreview();
        }

        function setMode(mode) {
            imageGenMode = (mode === 'gen');
            favMode = (mode === 'fav');
            document.documentElement.setAttribute('data-mode', mode);
            const btnChat = document.getElementById('modeBtnChat');
            const btnGen = document.getElementById('modeBtnGen');
            const btnFav = document.getElementById('modeBtnFav');
            const panel = document.getElementById('genControlsPanel');
            const favPage = document.getElementById('favPage');

            // 重置所有按钮
            btnChat.classList.remove('active');
            btnGen.classList.remove('active');
            if (btnFav) btnFav.classList.remove('active');
            panel.classList.remove('show');
            if (mode !== 'fav' && favPage) favPage.classList.remove('show');

            if (mode === 'fav') {
                if (btnFav) btnFav.classList.add('active');
                if (favPage) favPage.classList.add('show');
                userInput.placeholder = '收藏页面';
                clearImagePreview();
                // 瀑布流永不重建：初始化时渲染一次，后续只用原地增删
                if (!favRenderedOnce) { favRenderedOnce = true; renderFavorites(); }
            } else if (imageGenMode) {
                btnChat.classList.remove('active');
                btnGen.classList.add('active');
                loadGenSettings();
                restoreGenCollapse(); // 在 show 之前恢复折叠状态，避免闪烁
                updateGenControlUploadVisibility();
                panel.classList.add('show');
                userInput.placeholder = '输入图片描述词，Enter 发送';
                clearImagePreview();
                if (!isGenModel(activeModel)) autoSelectGenModel();
            } else {
                saveGenSettings(); // 离开生图时保存设置
                btnChat.classList.add('active');
                btnGen.classList.remove('active');
                panel.classList.remove('show');
                userInput.placeholder = '输入你的问题，Enter 发送，Shift+Enter 换行';
                clearGenControlImage();
                if (isGenModel(activeModel)) autoSelectChatModel();
            }
            renderModelDropdown();
            updateModelDisplay();
            try { localStorage.setItem('chatGenMode', mode); } catch(e) {}
            // 切换到当前模式的会话（switchChat 内部会 renderSidebar + renderChatArea）
            if (mode !== 'fav') switchChat(getCurrentId());
            else renderSidebar();
        }

        // 在 providers 中查找第一个匹配类型（gen/chat）的模型并切换
        function findFirstModelByType(isGen) {
            for (const p of providers) {
                for (const m of (p.models || [])) {
                    if (isGenModel(m) === isGen) return { pid: p.id, model: m };
                }
            }
            return null;
        }

        function autoSelectGenModel() {
            const found = findFirstModelByType(true);
            if (found) { activeProviderId = found.pid; activeModel = found.model; saveProvidersToStorage(); }
        }

        function autoSelectChatModel() {
            const found = findFirstModelByType(false);
            if (found) { activeProviderId = found.pid; activeModel = found.model; saveProvidersToStorage(); }
        }

        function loadImageGenMode() {
            try {
                const mode = localStorage.getItem('chatGenMode');
                if (mode === 'gen') {
                    imageGenMode = true;
                    document.documentElement.setAttribute('data-mode', 'gen');
                    document.getElementById('modeBtnChat').classList.remove('active');
                    document.getElementById('modeBtnGen').classList.add('active');

                    restoreGenCollapse();
                    document.getElementById('genControlsPanel').classList.add('show');
                    userInput.placeholder = '输入图片描述词，Enter 发送';
                    if (!isGenModel(activeModel)) autoSelectGenModel();
                } else if (mode === 'fav') {
                    imageGenMode = false;
                    favMode = true;
                    document.documentElement.setAttribute('data-mode', 'fav');
                    document.getElementById('modeBtnChat').classList.remove('active');
                    document.getElementById('modeBtnGen').classList.remove('active');

        function toggleGenControls(save = true) {
            const body = document.getElementById('genCollapseBody');
            const arrow = document.getElementById('genCollapseArrow');
            const sum = document.getElementById('genCollapseSummary');
            if (!body || !arrow) return;
            body.classList.toggle('collapsed');
            const collapsed = body.classList.contains('collapsed');
            arrow.textContent = collapsed ? '▼' : '▲';
            if (collapsed && sum) {
                sum.style.display = '';
                sum.textContent = buildGenSummary();
            } else if (sum) {
                sum.style.display = 'none';
            }
            if (save) try { localStorage.setItem('chatGenCollapsed', collapsed ? '1' : '0'); } catch(e) {}
        }

        // 确保折叠/展开到指定状态（不触发 toggle）
        function setGenCollapsed(collapsed) {
            const body = document.getElementById('genCollapseBody');
            const arrow = document.getElementById('genCollapseArrow');
            const sum = document.getElementById('genCollapseSummary');
            if (!body || !arrow) return;
            if (collapsed) {
                body.classList.add('collapsed');
                arrow.textContent = '▼';
                if (sum) { sum.style.display = ''; sum.textContent = buildGenSummary(); }
            } else {
                body.classList.remove('collapsed');
                arrow.textContent = '▲';
                if (sum) sum.style.display = 'none';
            }
        }

        function buildGenSummary() {
            const parts = [];
            parts.push(getGenSize());
            const steps = document.getElementById('genSteps').value;
            if (steps != 9) parts.push('步' + steps);
            const gs = document.getElementById('genGuidanceScale').value;
            if (gs != 1) parts.push('引导' + gs);
            const ctrl = document.getElementById('genControlMode').value;
            if (ctrl) parts.push(ctrl);
            return parts.join(', ');
        }

        function restoreGenCollapse() {
            try {
                const wantCollapsed = localStorage.getItem('chatGenCollapsed') === '1';
                setGenCollapsed(wantCollapsed);
            } catch(e) {}
            // 更新摘要
            const body = document.getElementById('genCollapseBody');
            const sum = document.getElementById('genCollapseSummary');
            if (sum && body && body.classList.contains('collapsed')) sum.textContent = buildGenSummary();
        }
