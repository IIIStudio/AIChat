        });

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            input.focus();
            performSearch();
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('searchResults');
            const clearBtn = document.getElementById('searchClearBtn');
            const statsDiv = document.getElementById('searchStats');

            clearBtn.style.display = query ? 'block' : 'none';

            if (!query) {
                resultsDiv.innerHTML = '<div style="color:var(--text-muted);padding:20px 0;font-size:13px;text-align:center;">输入关键词搜索会话</div>';
                statsDiv.style.display = 'none';
                return;
            }

            const results = [];
            sessions.forEach(session => {
                const titleMatch = (session.title || '').toLowerCase().includes(query);
                if (titleMatch) {
                    results.push({ sessionId: session.id, title: session.title, isTitleMatch: true });
                }
                session.messages.forEach(msg => {
                    let text = '';
                    if (Array.isArray(msg.content)) {
                        text = msg.content.filter(c => c.type === 'text').map(c => c.text).join(' ');
                    } else if (typeof msg.content === 'string') {
                        text = msg.content;
                    }
                    const idx = text.toLowerCase().indexOf(query);
                    if (idx !== -1) {
                        const existing = results.find(r => r.sessionId === session.id && !r.isTitleMatch);
                        if (!existing) {
                            const titleIdx = results.findIndex(r => r.sessionId === session.id && r.isTitleMatch);
                            if (titleIdx !== -1) results.splice(titleIdx, 1);
                            const start = Math.max(0, idx - 40);
                            const end = Math.min(text.length, idx + query.length + 50);
                            let preview = (start > 0 ? '…' : '') + text.substring(start, end) + (end < text.length ? '…' : '');
                            results.push({ sessionId: session.id, title: session.title, preview, isTitleMatch: false, role: msg.role });
                        }
                    }
                });
            });

            if (results.length === 0) {
                resultsDiv.innerHTML = '<div style="color:var(--text-muted);padding:20px 0;font-size:13px;text-align:center;">未找到匹配结果</div>';
                statsDiv.style.display = 'none';
                return;
            }

            resultsDiv.innerHTML = results.map(r => {
                const iconHTML = r.isTitleMatch
                    ? '<div class="search-result-icon" style="font-weight:700;">#</div>'
                    : (r.role === 'user'
                        ? '<div class="search-result-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg></div>'
                        : '<div class="search-result-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>');
                const roleTag = r.isTitleMatch ? '' : `<span class="search-result-role">${r.role === 'user' ? '你' : 'AI'}</span>`;
                const previewHTML = r.isTitleMatch ? ''
                    : `<div class="search-result-preview">${highlightText(escapeHtml(r.preview), query)}</div>`;
                return `
                    <div class="search-result-item" onclick="navigateToSession('${r.sessionId}')">
                        <div class="search-result-header">
                            ${iconHTML}
                            <span class="search-result-title">${highlightText(escapeHtml(r.title), query)}</span>
                            ${roleTag}
                        </div>
                        ${previewHTML}
                    </div>`;
            }).join('');

            statsDiv.style.display = 'flex';
            statsDiv.innerHTML = `
                <span class="stats-count">找到 ${results.length} 条结果</span>
                <span class="stats-close" onclick="closeSearchModal()">Esc 关闭</span>`;
        }

        function highlightText(text, query) {
            if (!query) return text;
            const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
        }

        function navigateToSession(id) {
            closeSearchModal();
            // session.id 是数字，onclick 传过来是字符串，需要转换类型
            const numId = Number(id);
            switchChat(numId);
        }

        // --- 聊天状态管理 ---
        let sessions = []; 
        let currentSessionId = null; 

        function saveSessionsToStorage() {
            try { localStorage.setItem('chatSessions', JSON.stringify({ sessions, currentSessionId })); } catch(e) {}
        }

        function loadSessionsFromStorage() {
            let migrated = false;
            try {
                const saved = localStorage.getItem('chatSessions');
                if (saved) {
                    const data = JSON.parse(saved);
                    sessions = data.sessions || [];
                    currentSessionId = data.currentSessionId || null;
                    // 迁移：给没有 presetId 的消息和版本历史补上会话的 presetId
                    sessions.forEach(s => {
                        if (!s.presetId) s.presetId = activePresetId;
                        s.messages.forEach(msg => {
                            if (msg.role === 'assistant' && msg.presetId == null) {
                                msg.presetId = s.presetId;
                                migrated = true;
                            }
                            if (msg.versions && Array.isArray(msg.versions)) {
                                msg.versions.forEach(ver => {
                                    if (ver.presetId == null) {
                                        ver.presetId = msg.presetId || s.presetId;
                                        migrated = true;
                                    }
                                });
                            }
                        });
                    });
                }
            } catch(e) {}
            if (sessions.length === 0) {
                const newId = Date.now();
                sessions = [{ id: newId, title: "新会话", messages: [], presetId: activePresetId, pinned: false }];
                currentSessionId = newId;
            }
            if (!sessions.find(s => s.id === currentSessionId)) {
                currentSessionId = sessions[0]?.id || null;
            }
            if (migrated) saveSessionsToStorage();
        }

        function createNewChat() {
            const newId = Date.now();
            sessions.unshift({ id: newId, title: "新会话", messages: [], presetId: activePresetId, pinned: false });
            switchChat(newId);
            saveSessionsToStorage();
            closeSidebarOnMobile();
        }

        function deleteChat(id, event) {
            event.stopPropagation(); 
            sessions = sessions.filter(s => s.id !== id);
            if (sessions.length === 0) createNewChat();
            else if (currentSessionId === id) switchChat(sessions[0].id);
            else renderSidebar();
            saveSessionsToStorage();
            showToast('会话已删除');
        }

        function togglePin(id, event) {
            event.stopPropagation();
            const session = sessions.find(s => s.id === id);
            if (!session) return;
            session.pinned = !session.pinned;
            saveSessionsToStorage();
            renderSidebar();
            showToast(session.pinned ? '已置顶' : '已取消置顶');
        }

        function switchChat(id) {
            currentSessionId = id;
            saveSessionsToStorage();
            // 同步该会话的预设
            const s = sessions.find(s => s.id === id);
            if (s && s.presetId != null && paramPresets.find(p => p.id === s.presetId)) {
                activePresetId = s.presetId;
                savePresets();
                renderPresetTags();
            }
            renderSidebar();
            renderChatArea();
            // 移动端选择会话后自动收起侧边栏
            closeSidebarOnMobile();
        }

        function closeSidebarOnMobile() {
            if (window.innerWidth <= 768) {
                const sidebar = document.getElementById('sidebar');
                const mobileOverlay = document.getElementById('sidebarMobileOverlay');
                if (!sidebar.classList.contains('hidden')) {
                    sidebar.classList.add('hidden');
                }
                if (mobileOverlay) mobileOverlay.classList.remove('show');
            }
        }

        function renderSidebar() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            const sortedSessions = [...sessions].sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return 0;
            });
            sortedSessions.forEach(session => {
                const item = document.createElement('div');
                item.className = `chat-history-item ${session.id === currentSessionId ? 'active' : ''}`;
                item.onclick = () => switchChat(session.id);

                const title = document.createElement('span');
                title.className = 'chat-title';
                title.textContent = session.title;

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'chat-history-icons';
                
                const pinIcon = document.createElement('div');
                const isPinned = session.pinned;
                pinIcon.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" style="color:${isPinned?'#d4a017':'inherit'}"><path d="M16 3v5c0 .8.3 1.6.9 2.2l1.1 1.1V13H6v-1.7l1.1-1.1c.6-.6.9-1.3.9-2.2V3h8z"></path><line x1="12" y1="13" x2="12" y2="21"></line><line x1="8" y1="21" x2="16" y2="21"></line></svg>`;
                pinIcon.style.cursor = 'pointer';
                pinIcon.title = isPinned ? '取消置顶' : '置顶';
                pinIcon.onclick = (e) => togglePin(session.id, e);

                const editIcon = document.createElement('div');
                editIcon.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>';
                editIcon.onclick = (e) => openRenameModal(session.id, session.title, e);

                const delIcon = document.createElement('div');
                delIcon.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
                delIcon.onclick = (e) => deleteChat(session.id, e);

                actionsDiv.appendChild(pinIcon);
                actionsDiv.appendChild(editIcon);
                actionsDiv.appendChild(delIcon);
                item.appendChild(title);
                item.appendChild(actionsDiv);
                list.appendChild(item);
            });
        }

        // --- 消息锚点导航 ---
        const messageAnchors = document.getElementById('messageAnchors');
        const anchorTooltip = document.getElementById('anchorTooltip');
        let anchorObserver = null;
        let anchorTexts = [];

        let hideTooltipTimeout = null;

        function bindTooltipClicks() {
            anchorTooltip.querySelectorAll('.anchor-tooltip-item').forEach(item => {
                item.addEventListener('click', () => {
                    const idx = parseInt(item.getAttribute('data-idx'));
                    const blocks = chatInner.querySelectorAll('.user-block');
                    if (blocks[idx]) {
                        blocks[idx].scrollIntoView({ block: 'start' });
                    }
                });
            });
        }

        function buildTooltipHTML(currentIndex) {
            if (anchorTexts.length === 0) return '';
            let html = '';
            anchorTexts.forEach((text, i) => {
                const cls = i === currentIndex ? ' anchor-tooltip-item current' : 'anchor-tooltip-item';
                html += `<div class="${cls}" data-idx="${i}"><span class="anchor-text">${escapeHtml(text)}</span><span class="anchor-dash">—</span></div>`;
            });
            return html;
        }

        function positionTooltip(refRect) {
            if (!anchorTooltip) return;
            let left = refRect.left - anchorTooltip.offsetWidth - 14;
            let top = refRect.top + refRect.height / 2 - anchorTooltip.offsetHeight / 2;
            if (left < 8) left = 8;
            if (top < 8) top = 8;
            if (top + anchorTooltip.offsetHeight > window.innerHeight - 8) {
                top = window.innerHeight - anchorTooltip.offsetHeight - 8;
            }
            anchorTooltip.style.left = left + 'px';
            anchorTooltip.style.top = top + 'px';
        }

        function showAnchorTooltipAt(refRect, currentIndex) {
            if (!anchorTooltip || anchorTexts.length === 0) return;
            anchorTooltip.innerHTML = buildTooltipHTML(currentIndex);
            anchorTooltip.classList.add('show');
            positionTooltip(refRect);
            bindTooltipClicks();
        }

        function hideAnchorTooltip(delayed) {
            if (!anchorTooltip) return;
            if (delayed) {
                clearTimeout(hideTooltipTimeout);
                hideTooltipTimeout = setTimeout(() => {
                    anchorTooltip.classList.remove('show');
                }, 150);
            } else {
                clearTimeout(hideTooltipTimeout);
                anchorTooltip.classList.remove('show');
            }
        }

        // 整个锚点条带和 tooltip 区域协同显示/隐藏
        if (messageAnchors) {
            messageAnchors.addEventListener('mouseenter', () => {
                clearTimeout(hideTooltipTimeout);
                showAnchorTooltipAt(messageAnchors.getBoundingClientRect(), -1);
            });
            messageAnchors.addEventListener('mouseleave', () => hideAnchorTooltip(true));
        }
        if (anchorTooltip) {
            anchorTooltip.addEventListener('mouseenter', () => {
                clearTimeout(hideTooltipTimeout);
                anchorTooltip.classList.add('show');
            });
            anchorTooltip.addEventListener('mouseleave', () => hideAnchorTooltip(true));
        }

        function updateMessageAnchors() {
            if (!messageAnchors) return;
            hideAnchorTooltip();
            const allBlocks = chatInner.querySelectorAll('.message-block');
            const blocks = Array.from(allBlocks).filter(b => b.classList.contains('user-block'));
            messageAnchors.innerHTML = '';

            // 收集所有用户消息文本
            anchorTexts = blocks.map(block => {
                const contentEl = block.querySelector('.message-content');
                return contentEl ? (contentEl.textContent || contentEl.getAttribute('data-raw') || '').substring(0, 20).trim() : '';
            });

            // 每次更新时清空 tooltip 内容
            if (anchorTooltip) anchorTooltip.innerHTML = '';

            if (blocks.length === 0) {
                messageAnchors.classList.add('hidden');
                if (anchorObserver) anchorObserver.disconnect();
                return;
            }
            messageAnchors.classList.remove('hidden');

            blocks.forEach((block, i) => {
                block.setAttribute('data-anchor-index', i);
                const dot = document.createElement('div');
                dot.className = 'anchor-dot';
                dot.title = '你的消息';
                // 悬停时更新当前高亮项
                dot.addEventListener('mouseenter', () => {
                    if (anchorTooltip && anchorTooltip.classList.contains('show')) {
                        anchorTooltip.innerHTML = buildTooltipHTML(i);
                        bindTooltipClicks();
                    }
                });
                dot.addEventListener('click', () => {
                    block.scrollIntoView({ block: 'start' });
                });
                messageAnchors.appendChild(dot);
            });

            // 重建 observer
            if (anchorObserver) anchorObserver.disconnect();
            anchorObserver = new IntersectionObserver((entries) => {
                let bestIdx = -1, bestRatio = 0;
                entries.forEach(e => {
                    if (e.intersectionRatio > bestRatio && e.isIntersecting) {
                        bestRatio = e.intersectionRatio;
                        bestIdx = parseInt(e.target.getAttribute('data-anchor-index'));
                    }
                });
                const dots = messageAnchors.querySelectorAll('.anchor-dot');
                dots.forEach(d => d.classList.remove('active'));
                if (bestIdx >= 0 && dots[bestIdx]) {
                    dots[bestIdx].classList.add('active');
                }
            }, { root: chatContainer, threshold: [0, 0.25, 0.5, 0.75, 1] });

            blocks.forEach(b => anchorObserver.observe(b));
        }

        // --- 核心渲染与请求 ---
        const chatContainer = document.getElementById('chatContainer');
        const chatInner = document.getElementById('chatInner');
        const welcomeScreen = document.getElementById('welcomeScreen');

        function renderChatArea() {
            const session = sessions.find(s => s.id === currentSessionId);
            
            // 清空除了 welcomeScreen 以外的所有消息块
            Array.from(chatInner.children).forEach(child => {
                if(child.id !== 'welcomeScreen') child.remove();
            });

            if (session.messages.length === 0) {
                welcomeScreen.style.display = 'block';
                updateMessageAnchors();
            } else {
                welcomeScreen.style.display = 'none';
                session.messages.forEach((msg, idx) => {
                    let displayContent, imageUrl;
                    let displayModel = msg.model;
                    let displayThought = msg.thought;
                    let displayPresetId = msg.presetId;
                    // 如果有版本历史且正在查看旧版本，使用旧版本内容
                    if (msg.role === 'assistant' && msg.versions && msg.versions.length > 0) {
                        const dv = msg.displayVersionIdx || 0;
                        if (dv > 0 && msg.versions[dv - 1]) {
                            const ver = msg.versions[dv - 1];
                            displayContent = ver.content;
                            displayModel = ver.model || msg.model;
                            displayThought = ver.thought || msg.thought;
                            displayPresetId = ver.presetId != null ? ver.presetId : msg.presetId;
                        } else if (Array.isArray(msg.content)) {
                            const textPart = msg.content.find(c => c.type === 'text');
                            displayContent = textPart ? textPart.text : '';
                        } else {
                            displayContent = msg.content;
                        }
                    } else if (Array.isArray(msg.content)) {
                        const textPart = msg.content.find(c => c.type === 'text');
                        displayContent = textPart ? textPart.text : '';
                        const imgPart = msg.content.find(c => c.type === 'image_url');
                        imageUrl = imgPart ? imgPart.image_url.url : null;
                    } else {
                        displayContent = msg.content;
                    }
                    appendMessageDOM(msg.role, displayContent, displayThought, imageUrl, displayModel, idx, displayPresetId);
                });
            }
            updateMessageAnchors();
        }

        function regenerateMessage(btn) {
            const block = btn.closest('.message-block');
            const allBlocks = Array.from(chatInner.querySelectorAll('.message-block'));
            const index = allBlocks.indexOf(block);
            if (index === -1) return;

            const currentSession = sessions.find(s => s.id === currentSessionId);
            const msg = currentSession.messages[index];
            // 保存当前回复到版本历史
            if (msg && msg.role === 'assistant') {
                pendingVersions = (msg.versions || []).slice();
                pendingVersions.push({ content: msg.content, thought: msg.thought, model: msg.model, presetId: msg.presetId });
            }
            currentSession.messages = currentSession.messages.slice(0, index); 
            saveSessionsToStorage();
            renderChatArea();
            fetchAIResponse();
        }

        // --- 消息编辑与删除 ---
        let editingMessageIndex = null;
        let pendingVersions = null;

        function editMessage(btnEl) {
            const block = btnEl.closest('.message-block');
            const contentEl = block.querySelector('.message-content');
            const idx = parseInt(contentEl.getAttribute('data-index'));
            if (isNaN(idx)) return;
            
            editingMessageIndex = idx;
            const session = sessions.find(s => s.id === currentSessionId);
            if (!session) return;
            const msg = session.messages[idx];
            if (!msg) return;
            
            const originalContent = Array.isArray(msg.content)
                ? msg.content.filter(c => c.type === 'text').map(c => c.text).join('\n')
                : (msg.content || '');
            
            // 将内容替换为文本框进行内联编辑
            const textarea = document.createElement('textarea');
            textarea.id = 'editingTextarea';
            textarea.value = originalContent;
            Object.assign(textarea.style, {
                width: '100%', minHeight: '60px', padding: '10px 14px',
                border: '2px solid var(--black-btn)', borderRadius: '10px', fontSize: '14px',
                resize: 'vertical', fontFamily: 'inherit', outline: 'none',
                background: 'var(--bg-surface)', lineHeight: '1.5', color: 'var(--text-main)'
            });
            textarea.onkeydown = (e) => {
                if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
            };
            
            const wrapper = contentEl.closest('.collapse-wrapper');
            const targetParent = wrapper || contentEl.parentElement;
            if (wrapper) {
                wrapper.classList.remove('collapsed');
                const toggleBtn = wrapper.parentElement.querySelector('.collapse-toggle');
                if (toggleBtn) toggleBtn.style.display = 'none';
            }
            targetParent.replaceChild(textarea, contentEl);
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);
            
            const actionsDiv = block.querySelector('.message-actions');
            actionsDiv.setAttribute('data-original-html', actionsDiv.innerHTML);
            actionsDiv.innerHTML = `
                <span onclick="cancelEdit()" style="cursor:pointer;font-size:12px;color:var(--text-muted);border:1px solid var(--border-color);border-radius:12px;padding:3px 10px;user-select:none;transition:all 0.15s;" onmouseover="this.style.borderColor='var(--text-main)';this.style.color='var(--text-main)'" onmouseout="this.style.borderColor='';this.style.color=''">取消</span>
                <span onclick="saveEdit()" style="cursor:pointer;font-size:12px;background:var(--text-main);color:var(--text-on-dark);border-radius:12px;padding:3px 12px;user-select:none;transition:all 0.15s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">保存并重新生成</span>
            `;
        }

        function cancelEdit() {
            editingMessageIndex = null;
            renderChatArea();
        }

        function saveEdit() {
            if (editingMessageIndex === null) return;
            const textarea = document.getElementById('editingTextarea');
            if (!textarea) return;
            const newText = textarea.value.trim();
            if (!newText) { showToast('内容不能为空'); return; }
            
            const session = sessions.find(s => s.id === currentSessionId);
            if (!session) return;
            const msg = session.messages[editingMessageIndex];
            if (!msg) return;
            
            // 如果原消息包含图片，保留图片部分
            if (Array.isArray(msg.content)) {
                const imgParts = msg.content.filter(c => c.type === 'image_url');
                msg.content = imgParts.length > 0
                    ? [{ type: 'text', text: newText }, ...imgParts]
                    : newText;
            } else {
                msg.content = newText;
            }
            
            // 保存原助手回复到版本历史
            const oldAsIdx = editingMessageIndex + 1;
            const oldAs = session.messages[oldAsIdx];
            if (oldAs && oldAs.role === 'assistant') {
                pendingVersions = (oldAs.versions || []).slice();
                pendingVersions.push({ content: oldAs.content, thought: oldAs.thought, model: oldAs.model, presetId: oldAs.presetId });
            }
            // 截断消息列表，仅保留到当前编辑的用户消息及之前的消息
            session.messages = session.messages.slice(0, editingMessageIndex + 1);
            
            editingMessageIndex = null;
            saveSessionsToStorage();
            renderChatArea();
            showToast('已保存，正在重新生成...');
            fetchAIResponse();
        }

        function deleteMessage(btnEl) {
            const block = btnEl.closest('.message-block');
            const contentEl = block.querySelector('.message-content');
            const idx = parseInt(contentEl.getAttribute('data-index'));
            if (isNaN(idx)) return;
            
            const session = sessions.find(s => s.id === currentSessionId);
            if (!session) return;
            
            if (block.classList.contains('user-block')) {
                // 删除用户消息及其后的助手回复
                const removeCount = (idx + 1 < session.messages.length && session.messages[idx + 1].role === 'assistant') ? 2 : 1;
                session.messages.splice(idx, removeCount);
            } else {
                const msg = session.messages[idx];
                // 有版本历史时，仅删除当前正在查看的版本
                if (msg && msg.versions && msg.versions.length > 0) {
                    const dv = msg.displayVersionIdx || 0;
                    if (dv === 0) {
                        // 删除当前最新版本，用上一个版本替换
                        const last = msg.versions.pop();
                        msg.content = last.content;
                        msg.thought = last.thought;
                        msg.model = last.model;
                        msg.displayVersionIdx = 0;
                        if (msg.versions.length === 0) delete msg.versions;
                        if (msg.displayVersionIdx === 0) delete msg.displayVersionIdx;
                    } else {
                        // 删除旧版本
                        msg.versions.splice(dv - 1, 1);
                        msg.displayVersionIdx = Math.min(msg.displayVersionIdx, msg.versions.length);
                        if (msg.versions.length === 0) delete msg.versions;
                        if (msg.displayVersionIdx === 0) delete msg.displayVersionIdx;
                    }
                    saveSessionsToStorage();
                    renderChatArea();
                    showToast('版本已删除');
                    return;
                }
                // 无版本历史，删除整条助手消息
                session.messages.splice(idx, 1);
            }
            
            if (session.messages.length === 0) {
                session.title = '新会话';
            }
            
            saveSessionsToStorage();
            renderChatArea();
            showToast('消息已删除');
        }

        function switchVersion(spanEl, direction) {
            const nav = spanEl.closest('.version-nav');
            const idx = parseInt(nav.getAttribute('data-msg-idx'));
            if (isNaN(idx)) return;
            const session = sessions.find(s => s.id === currentSessionId);
            if (!session) return;
            const msg = session.messages[idx];
            if (!msg || !msg.versions) return;
            if (msg.displayVersionIdx == null) msg.displayVersionIdx = 0;
            msg.displayVersionIdx += direction;
            const maxIdx = msg.versions.length;
            if (msg.displayVersionIdx < 0) msg.displayVersionIdx = 0;
            if (msg.displayVersionIdx > maxIdx) msg.displayVersionIdx = maxIdx;
            saveSessionsToStorage();
            renderChatArea();
        }

        // --- 消息折叠（仅对 user 长消息生效，默认折叠，不持久化） ---
        const COLLAPSE_THRESHOLD = 300; // 内容超过此字符数时自动折叠

        function appendMessageDOM(role, content, thought = null, imageUrl = null, msgModel = null, msgIndex = null, msgPresetId = null) {
            welcomeScreen.style.display = 'none';
            
            const blockDiv = document.createElement('div');
            blockDiv.className = `message-block ${role}-block`;

            if (role === 'assistant' && thought) {
                const thoughtDiv = document.createElement('details');
                thoughtDiv.className = 'thought-process';
                thoughtDiv.innerHTML = `
                    <summary class="thought-summary">
                        <span>思考过程</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </summary>
                    <div class="thought-content">${thought}</div>
                `;
                blockDiv.appendChild(thoughtDiv);
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            // 保存原始内容（Markdown 格式）
            contentDiv.setAttribute('data-raw', content);
            if (msgIndex != null) contentDiv.setAttribute('data-index', msgIndex);
            if (role === 'assistant' && content) {
                contentDiv.innerHTML = marked.parse(content).trim();
            } else {
                contentDiv.textContent = content;
            }

            // 长内容自动折叠（仅对 user 消息生效，默认折叠，不持久化）
            if (role === 'user' && content && content.length > COLLAPSE_THRESHOLD && msgIndex != null) {
                const wrapper = document.createElement('div');
                wrapper.className = 'collapse-wrapper collapsed';
                wrapper.appendChild(contentDiv);
                
                const toggleBtn = document.createElement('span');
                toggleBtn.className = 'collapse-toggle';
                const updateToggleLabel = () => {
                    toggleBtn.textContent = wrapper.classList.contains('collapsed') ? '展开全文 ▼' : '收起 ▲';
                };
                updateToggleLabel();
                toggleBtn.onclick = () => {
                    wrapper.classList.toggle('collapsed');
                    updateToggleLabel();
                };
                
                msgDiv.appendChild(wrapper);
                msgDiv.appendChild(toggleBtn);
            } else {
                msgDiv.appendChild(contentDiv);
            }
            if (imageUrl) {
                const img = document.createElement('img');
                img.src = imageUrl;
                img.className = 'user-image';
                img.onclick = () => window.open(imageUrl, '_blank');
                msgDiv.appendChild(img);
            }
            blockDiv.appendChild(msgDiv);

            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'message-actions';
            if (role === 'user') {
                actionsDiv.innerHTML = `
                    <svg onclick="editMessage(this)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="编辑"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                    <svg onclick="copyMessageText(this)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="复制"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <svg onclick="deleteMessage(this)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="删除"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                `;
            } else {
                const session = sessions.find(s => s.id === currentSessionId);
                const fallbackPresetId = (msgPresetId != null) ? msgPresetId : (session?.presetId);
                const msgPreset = (fallbackPresetId != null) ? paramPresets.find(p => p.id === fallbackPresetId) : getActivePreset();
                const presetName = msgPreset?.name || '';
                const presetTagHtml = presetName ? `<span class="msg-preset-tag">${escapeHtml(presetName)}</span>` : '';
                const displayModel = msgModel || activeModel;
                const msgLogo = msgModel ? getLogoForModel(msgModel) : getActiveLogo();
                const msgLogoHtml = msgLogo
                    ? `<img class="model-logo" src="${msgLogo}" alt="" onerror="this.style.display='none'" style="width:14px;height:14px;border-radius:3px;">`
                    : '';
                // 版本切换导航
                const msg = (session && msgIndex != null) ? session.messages[msgIndex] : null;
                const versions = (msg && msg.versions) ? msg.versions : [];
                const dv = (msg && msg.displayVersionIdx != null) ? msg.displayVersionIdx : 0;
                const totalVersions = versions.length + 1;
                let versionNavHtml = '';
                if (totalVersions > 1) {
                    const currentVer = totalVersions - dv;
                    versionNavHtml = `<span class="version-nav" data-msg-idx="${msgIndex}" style="display:inline-flex;align-items:center;gap:3px;user-select:none;flex-shrink:0;">
                        <span onclick="event.stopPropagation();switchVersion(this,1)" style="cursor:pointer;opacity:0.4;font-size:16px;transition:opacity 0.15s;line-height:1;font-weight:600;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='0.4'">◂</span>
                        <span style="font-size:12px;color:var(--text-muted);">${currentVer}/${totalVersions}</span>
                        <span onclick="event.stopPropagation();switchVersion(this,-1)" style="cursor:pointer;opacity:0.4;font-size:16px;transition:opacity 0.15s;line-height:1;font-weight:600;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='0.4'">▸</span>
                    </span>`;
                }
                const delTitle = totalVersions > 1 ? '删除此版本' : '删除此回复';
                actionsDiv.innerHTML = `
                    <svg onclick="regenerateMessage(this)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="重新生成"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    <svg onclick="copyMessageText(this)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="复制"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <svg onclick="deleteMessage(this)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="${delTitle}"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    ${versionNavHtml}
                    <span class="msg-model-tag" onclick="event.stopPropagation(); retryWithDropdown(this.closest('.message-block'))">${msgLogoHtml}${escapeHtml(displayModel)}</span>
                    ${presetTagHtml}
                `;
            }
            blockDiv.appendChild(actionsDiv);

            chatInner.appendChild(blockDiv);
            // 添加新消息后自动滚动到底部
            requestAnimationFrame(() => { chatContainer.scrollTop = chatContainer.scrollHeight; });
            updateMessageAnchors();
            return contentDiv; 
        }

        let pendingFile = null;
        function handleFileSelected(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                if (!file.type.startsWith('image/')) { showToast('仅支持图片文件'); input.value = ''; return; }
                const reader = new FileReader();
                reader.onload = (e) => {
                    pendingFile = { base64: e.target.result, name: file.name };
                    document.getElementById('imagePreviewThumb').src = e.target.result;
                    document.getElementById('imagePreviewName').textContent = file.name;
                    document.getElementById('imagePreviewArea').style.display = 'flex';
                };
                reader.readAsDataURL(file);
                input.value = '';
            }
        }

        function clearImagePreview() {
            pendingFile = null;
            document.getElementById('imagePreviewArea').style.display = 'none';
            document.getElementById('imagePreviewThumb').src = '';
        }

        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        userInput.addEventListener('input', function() {
            this.style.height = '24px';
            let scrollHeight = this.scrollHeight;
            this.style.height = (scrollHeight > 150 ? 150 : scrollHeight) + 'px';
            if(scrollHeight > 150) this.style.overflowY = 'auto';
            else this.style.overflowY = 'hidden';
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        async function readSSEStream(body, el) {
            el.style.whiteSpace = 'pre-wrap';
            const reader = body.getReader();
            const decoder = new TextDecoder();
            let full = '', buf = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += decoder.decode(value, { stream: true });
                const lines = buf.split('\n');
                buf = lines.pop() || '';
                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const payload = line.slice(6).trim();
                    if (!payload || payload === '[DONE]') continue;
                    try {
                        const delta = JSON.parse(payload).choices?.[0]?.delta?.content;
                        if (delta) { full += delta; el.textContent = full; }
                    } catch(e) {}
                }
                // 流式输出时持续滚动到底部
                requestAnimationFrame(() => { chatContainer.scrollTop = chatContainer.scrollHeight; });
            }
            return full;
        }

        async function fetchAIResponse() {
            const provider = getActiveProvider();
            if (!provider) { sendBtn.disabled = false; return; }

            const currentSession = sessions.find(s => s.id === currentSessionId);
            sendBtn.disabled = true;

            const preset = getActivePreset();
            const fakeThought = "Thinking about your request...";
            const msgIdx = currentSession.messages.length;
            const aiMessageElement = appendMessageDOM('assistant', '正在思考...', fakeThought, null, null, msgIdx);

            try {
                let messages = [...currentSession.messages];
                if (preset && preset.systemPrompt) {
                    messages = [{ role: 'system', content: preset.systemPrompt }, ...messages];
                }
                const useStream = preset ? preset.stream : false;
                const body = {
                    model: activeModel,
                    messages: messages,
                    stream: useStream,
                    temperature: preset ? preset.temperature : 0.7,
                    top_p: preset ? preset.top_p : 1,
                    frequency_penalty: preset ? preset.frequency_penalty : 0,
                    presence_penalty: preset ? preset.presence_penalty : 0
                };
                const response = await fetch(normalizeApiUrl(provider.apiUrl), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${provider.apiKey}` },
                    body: JSON.stringify(body)
                });

                if (!response.ok) {
                    const errText = await response.text();
                    let errMsg = `HTTP 状态码 ${response.status}`;
                    try { errMsg = JSON.parse(errText).error?.message || errMsg; } catch(e) {}
                    throw new Error(errMsg);
                }

                let aiReply;
                if (useStream && response.body) {
                    aiReply = await readSSEStream(response.body, aiMessageElement);
                } else {
                    const data = await response.json();
                    aiReply = data.choices[0].message.content;
                }
                currentSession.messages.push({ role: "assistant", content: aiReply, thought: fakeThought, model: activeModel, presetId: activePresetId });
                if (pendingVersions !== null) {
                    currentSession.messages[currentSession.messages.length - 1].versions = pendingVersions;
                    pendingVersions = null;
                }
                saveSessionsToStorage();
                renderChatArea();

            } catch (error) {
                const msg = error.message || '';
                if (msg.toLowerCase().includes('image') || msg.includes('图片')) {
                    // 尝试过滤图片内容后重试
                    let filtered = false;
                    currentSession.messages.forEach(m => {
                        if (m.role === 'user' && Array.isArray(m.content)) {
                            const textOnly = m.content.filter(c => c.type === 'text');
                            if (textOnly.length === 1) m.content = textOnly[0].text;
                            else if (textOnly.length === 0) m.content = '';
                            else m.content = textOnly;
                            filtered = true;
                        }
                    });
                    if (filtered) {
                        saveSessionsToStorage();
                        // 插入提示
                        const tipMsg = '⚠️ 该模型不支持图片输入，已自动转为纯文字发送';
                        currentSession.messages.push({ role: "assistant", content: tipMsg, presetId: activePresetId });
                        saveSessionsToStorage();
                        renderChatArea();
                        setTimeout(() => fetchAIResponse(), 100);
                    } else {
                        const errMsg = '该模型不支持图片输入，请移除图片或切换到支持多模态的模型后重试。';
                        currentSession.messages.push({ role: "assistant", content: errMsg, presetId: activePresetId });
                        pendingVersions = null;
                        saveSessionsToStorage();
                        renderChatArea();
                    }
                } else {
                    const errFull = `请求失败: ${msg}`;
                    currentSession.messages.push({ role: "assistant", content: errFull, presetId: activePresetId });
                    pendingVersions = null;
                    saveSessionsToStorage();
                    renderChatArea();
                }
            } finally {
                sendBtn.disabled = false;
                // 请求完成后自动滚动到底部
                requestAnimationFrame(() => { chatContainer.scrollTop = chatContainer.scrollHeight; });
            }
        }

        function sendMessage() {
            const text = userInput.value.trim();
            const hasImage = pendingFile != null;
            if (!text && !hasImage) return;

            const provider = getActiveProvider();
            if (!provider || !provider.apiUrl || !provider.apiKey || !activeModel) {
                showToast('请配置 API 参数！');
                openSettings();
                return;
            }

            const currentSession = sessions.find(s => s.id === currentSessionId);
            if (currentSession.messages.length === 0) {
                currentSession.title = text.length > 12 ? text.substring(0, 12) + '...' : text || '图片消息';
                renderSidebar();
            }

            let content, displayText, imageForDisplay = null;
            if (hasImage) {
                const imageContent = { type: 'image_url', image_url: { url: pendingFile.base64 } };
                content = text ? [{ type: 'text', text: text }, imageContent] : [imageContent];
                displayText = text || '图片';
                imageForDisplay = pendingFile.base64;
            } else {
                content = text;
                displayText = text;
            }

            appendMessageDOM('user', displayText, null, imageForDisplay, null, currentSession.messages.length);
            currentSession.messages.push({ role: "user", content: content });
            saveSessionsToStorage();
            
            clearImagePreview();
            userInput.value = '';
            userInput.style.height = '24px';
            
            fetchAIResponse();
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const btn = document.querySelector('.dark-mode-btn');
            const sunIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
            const moonIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
            
            const currentTheme = html.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                html.removeAttribute('data-theme');
                btn.innerHTML = moonIcon;
                btn.title = '切换深色模式';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.innerHTML = sunIcon;
                btn.title = '切换浅色模式';
                localStorage.setItem('theme', 'dark');
            }
        }

        // 初始化主题
        (function initTheme() {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                const btn = document.querySelector('.dark-mode-btn');
                btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
                btn.title = '切换浅色模式';
            }
        })();
    </script>
